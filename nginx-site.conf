worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip off;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    map $uri $csp_value {
        default "default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.cubeos.app; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://analytics.cubeos.app https://api.github.com; frame-src https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self';";
    }

    # shop.meshsat.net (MESHSAT-1517): no Stripe or other third-party script on
    # this host. The two forms post to our own list (listmonk) and to the Hub's
    # checkout and withdrawal pages; the film is the same nocookie facade. The
    # ALTCHA widget (script, challenge fetch, a blob worker for the proof of
    # work) comes from list.meshsat.net, ours (MESHSAT-1519).
    map $uri $csp_shop {
        default "default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.cubeos.app https://list.meshsat.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://analytics.cubeos.app https://list.meshsat.net; worker-src 'self' blob:; frame-src https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://list.meshsat.net https://hub.meshsat.net;";
    }

    # meshsat.net. default_server, so a request without a matching Host (the
    # edge's health checks) still lands here, as it did when server_name was _.
    server {
        listen 8443 ssl http2 default_server;
        server_name meshsat.net;
        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp_value always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        error_page 404 /404.html;

        # nginx listens on 8443 behind HAProxy, so its automatic directory redirect
        # ("/security" -> "/security/") used to emit the INTERNAL port:
        # https://meshsat.net:8443/security/, which is not reachable from the public
        # internet. Relative Location headers resolve against whatever the client used.
        # Do not turn this back on (MESHSAT-1183).
        absolute_redirect off;

        location /healthz {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        # The 404 pages exist only as the body of a 404. Fetched directly they
        # answered 200 "Page not found", which Google counts as a Soft 404; that
        # is what failed the validation of 7 Oct 2026 (MESHSAT-1184). Hugo also
        # builds /nl/ /de/ /fr/ /el/404.html, which nothing should serve.
        location ~ ^/(?:[a-z][a-z]/)?404\.html$ {
            internal;
        }

        # Hugo's /en/ is a 200 stub (noindex, canonical to /, meta refresh) that
        # Search Console has filed under Soft 404, noindex and Alternative page in
        # turn. A real redirect leaves it one honest row: Page with redirect.
        location = /en/ {
            return 301 /;
        }

        location = /en {
            return 301 /;
        }

        # Files only: the bare directory answered 403, a row in Search Console
        # (MESHSAT-1186). RFC 9116 wants security.txt as text/plain; charset=utf-8.
        location ^~ /.well-known/ {
            charset utf-8;
            try_files $uri =404;
        }

        # Self-hosted fonts (MESHSAT-950): also consumed cross-origin by the
        # authentik brand CSS on auth.meshsat.net, hence the CORS header.
        location ^~ /fonts/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Access-Control-Allow-Origin "https://auth.meshsat.net" always;
            add_header Vary "Origin" always;
        }

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Hidden files: 404, not 403. A 403 tells a scanner something is here.
        location ~ /\. {
            return 404;
        }
    }

    # shop.meshsat.net (MESHSAT-1517): the MeshSat Compact v2 page and its legal
    # pages, built from shop/ into a second docroot. Same TLS, same rules as the
    # site: relative redirects, real 404s, the 404 page internal, hidden paths 404.
    server {
        listen 8443 ssl http2;
        server_name shop.meshsat.net;
        root /usr/share/nginx/html-shop;
        index index.html;

        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp_shop always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        error_page 404 /404.html;
        absolute_redirect off;

        location /healthz {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location = /404.html {
            internal;
        }

        location ^~ /.well-known/ {
            charset utf-8;
            try_files $uri =404;
        }

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location ~ /\. {
            return 404;
        }
    }
}
