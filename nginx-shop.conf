# shop.meshsat.net on the notrf01 cluster (MESHSAT-1521): the shop server block
# of nginx-site.conf without TLS (ingress-nginx terminates it and the edge
# re-encrypts), listening on 8080 as nginx-unprivileged does. Same locations,
# same headers, same CSP as the DMZ vhost it replaces; absolute_redirect off and
# the real 404 (MESHSAT-1183/1184) stay.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;
events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server_tokens off;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip off;

    map $uri $csp_shop {
        default "default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.cubeos.app https://list.meshsat.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://analytics.cubeos.app https://list.meshsat.net; worker-src 'self' blob:; frame-src https://www.youtube-nocookie.com https://challenges.cloudflare.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://list.meshsat.net https://order.meshsat.net;";
    }

    server {
        listen 8080;
        server_name shop.meshsat.net;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp_shop always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        error_page 404 /404.html;
        absolute_redirect off;

        location /healthz {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location = /404.html {
            internal;
        }

        location ^~ /.well-known/ {
            charset utf-8;
            try_files $uri =404;
        }

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location ~ /\. {
            return 404;
        }
    }
}
