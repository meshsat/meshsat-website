# Security headers for docs.meshsat.net, included by the server block and by
# every location that adds a header of its own (nginx's add_header is not
# inherited past a location that sets any header). Copied to
# /etc/nginx/security-headers.conf by Dockerfile.docs (MESHSAT-1610).
# X-XSS-Protection left the list: browsers ignore it and OWASP advises against it.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Content-Security-Policy $csp_value always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
