# =============================================================================
# MeshSat Website Pipeline — Hugo + VitePress + Install → GHCR → AWX Deploy
# Serves: meshsat.net, docs.meshsat.net, get.meshsat.net
# =============================================================================
stages:
  - validate
  - build
  - docker
  - deploy

variables:
  HUGO_IMAGE: "registry-gitlab.nuclearlighters.net/infrastructure/nllei01/production/hugo-runner:1.5"
  NODE_IMAGE: "node:20-alpine"
  BASE_IMAGE: "registry-gitlab.nuclearlighters.net/infrastructure/nllei01/production/cubeos-nginx-base:latest"
  GHCR_SITE: "ghcr.io/papadopouloskyriakos/meshsat-website"
  GHCR_DOCS: "ghcr.io/papadopouloskyriakos/meshsat-docs"
  GHCR_INSTALL: "ghcr.io/papadopouloskyriakos/meshsat-releases"
  AWX_HOST: "https://awx.nuclearlighters.net"

# Build and deploy only for pushes to main (and manual web runs). Scheduled,
# triggered and CHANGELOG_RUN=1 pipelines exist for changelog:regenerate only;
# the bot's own push starts a normal push pipeline that deploys.
.rules-main-deploy:
  rules:
    - if: '$CHANGELOG_RUN == "1"'
      when: never
    - if: '$DEPLOY_RUN == "1" && $CI_COMMIT_BRANCH == "main"'
    - if: '($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_BRANCH == "main"'

# -----------------------------------------------------------------------------
# CONSISTENCY CHECK — traceability gate
# -----------------------------------------------------------------------------
lint:consistency:
  stage: validate
  image: alpine:latest
  tags: [docker]
  variables:
    GIT_DEPTH: 50
  before_script:
    - apk add --no-cache git bash
  script:
    - |
      bash <<'CONSISTENCY_CHECK'
      WARNINGS=()
      if ! echo "$CI_COMMIT_MESSAGE" | grep -qE '\[MESHSAT-[0-9]+\]'; then
        if ! echo "$CI_COMMIT_MESSAGE" | grep -qE '^chore: bump version'; then
          WARNINGS+=("Traceability: commit has no [MESHSAT-XX] reference")
        fi
      fi
      echo ""
      echo "=== Consistency Check: meshsat-website ==="
      if [ ${#WARNINGS[@]} -gt 0 ]; then
        echo "WARNINGS (review recommended):"
        for w in "${WARNINGS[@]}"; do echo "  [WARN]  $w"; done
      else
        echo "  All checks passed."
      fi
      echo "PASSED"
      CONSISTENCY_CHECK
  rules:
    - when: always
  allow_failure: true

# -----------------------------------------------------------------------------
# CHANGELOG — regenerate /changelog/ from GitLab commit history [MESHSAT-853]
# -----------------------------------------------------------------------------
# Runs only on the nightly schedule, on a multi-project trigger from a product
# repo's tag pipeline, or when a pipeline is started with CHANGELOG_RUN=1.
# It never runs on push pipelines, so the bot's own push cannot loop. Not
# allow_failure on purpose: a red job is the only signal for an expired token,
# an API outage, a rejected push or a lagging GitHub mirror.
# Tokens (project variables, masked + protected): CHANGELOG_READ_TOKEN
# (group access token "meshsat-changelog-read" on products, Reporter,
# read_api) and CHANGELOG_PUSH_TOKEN (project access token
# "meshsat-changelog-push" on this project, Maintainer, write_repository).
# Both expire 2027-09-01; rotation steps are in scripts/generate-changelog.py.
# The bot pushes with ci.skip and then starts the deploy pipeline with its own
# job token (DEPLOY_RUN=1): a pipeline created by the bot user's push cannot
# pull the private hugo-runner image (project bots cannot be members of the
# infrastructure project, verified 7 Sep 2026), whereas the job-token pipeline
# runs as the schedule owner or the tag pusher, like a human push.
changelog:regenerate:
  stage: validate
  image: python:3.12-alpine
  tags: [docker]
  resource_group: changelog
  needs: []
  variables:
    GIT_STRATEGY: none
    CHANGELOG_ISSUE: "MESHSAT-853"
  before_script:
    - apk add --no-cache git curl
  script:
    - |
      set -euo pipefail
      : "${CHANGELOG_READ_TOKEN:?missing project variable}"
      : "${CHANGELOG_PUSH_TOKEN:?missing project variable}"
      WORK=$(mktemp -d)
      git clone --quiet --depth 1 --branch main \
        "https://oauth2:${CHANGELOG_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$WORK"
      cd "$WORK"
      GITLAB_TOKEN="$CHANGELOG_READ_TOKEN" python3 scripts/generate-changelog.py --verify-mirror --check
      git add site/content/changelog/
      if git diff --cached --quiet; then
        echo "changelog: no upstream change, nothing to commit"
        exit 0
      fi
      git -c user.name="Kyriakos Papadopoulos" -c user.email="ncpjfuzl@mxmx.email" \
        commit -q -m "docs(changelog): regenerate from GitLab [${CHANGELOG_ISSUE}]"
      git push --quiet -o ci.skip origin HEAD:main
      SHA=$(git rev-parse --short HEAD)
      for attempt in 1 2 3; do
        if RESP=$(curl -sf -X POST -F "token=${CI_JOB_TOKEN}" -F "ref=main" -F "variables[DEPLOY_RUN]=1" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/trigger/pipeline"); then
          echo "changelog: pushed ${SHA} (ci.skip); deploy pipeline $(echo "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])') started"
          exit 0
        fi
        echo "changelog: deploy trigger attempt ${attempt} failed, retrying"; sleep 10
      done
      echo "changelog: pushed ${SHA} but could not start its deploy pipeline; start one by hand with DEPLOY_RUN=1"
      exit 1
  rules:
    - if: '$CI_COMMIT_BRANCH != "main"'
      when: never
    - if: '$DEPLOY_RUN == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CHANGELOG_RUN == "1"'

# -----------------------------------------------------------------------------
# BUILD — Hugo site + VitePress docs
# -----------------------------------------------------------------------------
build:site:
  stage: build
  image: $HUGO_IMAGE
  tags: [docker]
  script:
    - cd site
    - hugo version
    - hugo --minify --gc --environment production
  artifacts:
    paths:
      - site/public/
    expire_in: 1 hour
  rules: !reference [.rules-main-deploy, rules]

build:docs:
  stage: build
  image: $NODE_IMAGE
  tags: [docker]
  script:
    - cd docs
    - npm ci
    - npx vitepress build
  artifacts:
    paths:
      - docs/.vitepress/dist/
    expire_in: 1 hour
  rules: !reference [.rules-main-deploy, rules]

# -----------------------------------------------------------------------------
# VERIFY:SITE — content + i18n gates. BLOCKS the deploy on purpose.
# Added after get.meshsat.net was found serving an unrelated site for months
# because nothing tested whether the site's own instructions work [MESHSAT-724].
# Logic lives in scripts/verify-site.sh so it can be run locally, unchanged.
# -----------------------------------------------------------------------------
verify:site:
  stage: build
  image: $HUGO_IMAGE
  tags: [docker]
  script:
    - ./scripts/verify-site.sh site/public
  needs:
    - job: build:site
      artifacts: true
  rules: !reference [.rules-main-deploy, rules]

# -----------------------------------------------------------------------------
# DOCKER — Build and push container images to GHCR
# -----------------------------------------------------------------------------
docker:site:
  stage: docker
  image: $HUGO_IMAGE
  tags: [docker]
  before_script:
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
    - docker login registry-gitlab.nuclearlighters.net -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
  script:
    - cp -r site/public/ public/
    - docker build --pull --no-cache --build-arg BASE_IMAGE=${BASE_IMAGE} -f Dockerfile.site -t ${GHCR_SITE}:${CI_COMMIT_SHORT_SHA} -t ${GHCR_SITE}:latest .
    - docker push ${GHCR_SITE}:${CI_COMMIT_SHORT_SHA}
    - docker push ${GHCR_SITE}:latest
    - rm -rf public/
  needs:
    - job: build:site
      artifacts: true
    - job: verify:site
  rules: !reference [.rules-main-deploy, rules]

docker:docs:
  stage: docker
  image: $HUGO_IMAGE
  tags: [docker]
  before_script:
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
    - docker login registry-gitlab.nuclearlighters.net -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
  script:
    - docker build --pull --no-cache --build-arg BASE_IMAGE=${BASE_IMAGE} -f Dockerfile.docs -t ${GHCR_DOCS}:${CI_COMMIT_SHORT_SHA} -t ${GHCR_DOCS}:latest .
    - docker push ${GHCR_DOCS}:${CI_COMMIT_SHORT_SHA}
    - docker push ${GHCR_DOCS}:latest
  needs:
    - job: build:docs
      artifacts: true
  rules: !reference [.rules-main-deploy, rules]

docker:install:
  stage: docker
  image: $HUGO_IMAGE
  tags: [docker]
  before_script:
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
    - docker login registry-gitlab.nuclearlighters.net -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
  script:
    - docker build --pull --no-cache --build-arg BASE_IMAGE=${BASE_IMAGE} -f Dockerfile.install -t ${GHCR_INSTALL}:${CI_COMMIT_SHORT_SHA} -t ${GHCR_INSTALL}:latest .
    - docker push ${GHCR_INSTALL}:${CI_COMMIT_SHORT_SHA}
    - docker push ${GHCR_INSTALL}:latest
  needs:
    - job: verify:site
  rules: !reference [.rules-main-deploy, rules]

# -----------------------------------------------------------------------------
# DEPLOY — Trigger AWX deployment
# -----------------------------------------------------------------------------
deploy:
  stage: deploy
  image: $HUGO_IMAGE
  resource_group: deploy
  tags: [docker]
  script:
    - |
      echo "Triggering AWX deployment..."
      RESPONSE=$(curl -s -X POST \
        -H "Authorization: Bearer ${AWX_TOKEN}" \
        -H "Content-Type: application/json" \
        -d '{}' \
        "${AWX_HOST}/api/v2/job_templates/${AWX_JOB_TEMPLATE_ID}/launch/")
      echo "AWX response: $RESPONSE"
      JOB_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
      if [ -z "$JOB_ID" ]; then
        echo "ERROR: Failed to launch AWX job"
        echo "$RESPONSE" | jq .
        exit 1
      fi
      echo "AWX job launched: $JOB_ID"
      # Poll for completion (max 5 minutes)
      for i in $(seq 1 30); do
        sleep 10
        STATUS=$(curl -s \
          -H "Authorization: Bearer ${AWX_TOKEN}" \
          "${AWX_HOST}/api/v2/jobs/${JOB_ID}/" | jq -r '.status')
        echo "Job $JOB_ID status: $STATUS"
        case "$STATUS" in
          successful) echo "Deployment successful"; exit 0 ;;
          failed|error|canceled) echo "Deployment $STATUS"; exit 1 ;;
        esac
      done
      echo "ERROR: Deployment timed out after 5 minutes"
      exit 1
  needs:
    - job: docker:site
    - job: docker:docs
    - job: docker:install
  rules: !reference [.rules-main-deploy, rules]
