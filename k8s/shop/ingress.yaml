# shop.meshsat.net -> shop-site:8080. The edge re-encrypts to ingress-nginx with
# SNI and verifies the wildcard this Secret carries.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-site
  namespace: meshsat-website
  labels:
    app.kubernetes.io/name: shop-site
spec:
  ingressClassName: nginx
  tls:
    - hosts: [shop.meshsat.net]
      secretName: meshsat-net-tls
  rules:
    - host: shop.meshsat.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop-site
                port:
                  number: 8080
