apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: shop-site-confine
  namespace: meshsat-website
  labels:
    app.kubernetes.io/name: shop-site
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: shop-site
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ingress-nginx
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
