apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# shop.meshsat.net on notrf01cl01k8s (MESHSAT-1521): the static shop pages as
# an nginx Deployment, the Hub's layout. Synced by the Argo CD Application
# `meshsat-website` (infra repo k8s/argocd-apps/meshsat-website/). The image
# digest is pinned ONLY here; the CI job bump_k8s_pin rewrites it on every main
# pipeline (k8s/scripts/bump-pin.py).

labels:
  - pairs:
      app.kubernetes.io/part-of: meshsat-website
      environment: production
    includeSelectors: false

resources:
  - namespaces.yaml
  - platform/
  - shop/

images:
  - name: ghcr.io/meshsat/meshsat-shop-site
    digest: sha256:02ca799a4487b5f01ecdbd861ff080288e6eedd6e95e1d4fdfefcf5daacb3789  # main d6b1062f (2026-10-10)
