# GHCR pull secret (ghcr.io/meshsat/* is private): the organisation's read-only
# credential, the same OpenBao property the Hub's namespaces read.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-meshsat
  namespace: meshsat-website
  labels:
    app.kubernetes.io/name: registry-meshsat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: registry-meshsat
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"auth":"{{ .ghcr_auth }}"}}}
  data:
    - secretKey: ghcr_auth
      remoteRef:
        key: ci-no/apps/meshsat-hub/registry
        property: ghcr_auth
