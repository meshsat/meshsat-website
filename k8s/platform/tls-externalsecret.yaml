# *.meshsat.net for the shop.meshsat.net Ingress (the NL cert-manager's push,
# MESHSAT-865), as the Hub and the shop service read it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meshsat-net-tls
  namespace: meshsat-website
  labels:
    app.kubernetes.io/name: meshsat-net-tls
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: meshsat-net-tls
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .crt }}"
        tls.key: "{{ .key }}"
  data:
    - secretKey: crt
      remoteRef:
        key: k8s/shared/wildcard-meshsat-net-tls
        property: tls.crt
    - secretKey: key
      remoteRef:
        key: k8s/shared/wildcard-meshsat-net-tls
        property: tls.key
