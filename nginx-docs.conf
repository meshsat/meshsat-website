worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp paths for unprivileged Chainguard nginx
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Security
    server_tokens off;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    # Compression stays off on every MeshSat host (owner ruling 21 Oct 2026,
    # BREACH posture, eca8c0b). Do not turn it on; cut raw bytes instead.
    gzip off;

    # CSP for the docs. Fonts are self-hosted (Google Fonts left the list on
    # 21 Oct 2026, MESHSAT-1610: nothing in docs/ referenced it). The analytics
    # host stays for MESHSAT-1227 (docs Umami, undecided).
    map $uri $csp_value {
        default "default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.cubeos.app; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://analytics.cubeos.app; frame-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';";
    }

    server {
        listen 8443 ssl http2;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # TLS config
        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # One header set for every response, included again in every location
        # that adds a header of its own (nginx drops the inherited list there).
        # MESHSAT-1610.
        include /etc/nginx/security-headers.conf;

        # VitePress builds its own branded 404.html; "=404" in the location
        # block below lands here, so the page is served WITH a 404 status
        # instead of nginx's stock error page (MESHSAT-1184).
        error_page 404 /404.html;

        # nginx listens on 8443 behind HAProxy, so its automatic directory redirect
        # ("/guide" -> "/guide/") used to emit the INTERNAL port:
        # https://docs.meshsat.net:8443/guide/, which is not reachable from the public
        # internet. Relative Location headers resolve against whatever the client used.
        # Do not turn this back on (MESHSAT-1183).
        absolute_redirect off;

        # Health check
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # VitePress emits per-page .html files, so resolve extensionless deep
        # links to them ($uri.html) before anything else (MESHSAT-728: falling
        # through to the home shell leaves home-hero remnants in the DOM after
        # the client router's hydration mismatch).
        #
        # There is deliberately NO SPA fallback. VitePress pre-renders every
        # route, so a path that does not resolve here does not exist, and the
        # old "/index.html" fallback answered 200 with the docs home page for
        # every stale or mistyped URL. Google reads that as a Soft 404, which is
        # what it was reporting for this site (MESHSAT-1184). "=404" hands off to
        # the error_page above, which serves VitePress's own 404.html WITH a 404
        # status.
        #
        # One URL per page: an extensionless deep link whose .html exists is a
        # 301 to it. Both forms answered 200 with the same page while the
        # canonical, the sitemap and the docs' own links say "x.html"; the Bridge
        # README links the short form, Googlebot crawled that more often, and
        # Search Console reported "Duplicate, Google chose different canonical
        # than user" (25 Oct 2026, MESHSAT-1697). $uri.html stays in try_files
        # for paths the redirect does not catch.
        location / {
            if (-f $request_filename.html) {
                return 301 $uri.html$is_args$args;
            }
            try_files $uri $uri.html $uri/ =404;
        }

        # 404.html exists only as the body of a 404. Fetched directly, as
        # /404.html or extensionless /404, it answered 200 "404", a Soft 404
        # (MESHSAT-1184, validation failed 7 Oct 2026). The error_page redirect
        # above is internal, so it still reaches the file.
        location ~ ^/404(?:\.html)?$ {
            internal;
        }

        # Allow .well-known files (the bare directory is a 404, MESHSAT-1186).
        # RFC 9116 wants security.txt as text/plain; charset=utf-8 (MESHSAT-1699).
        location ^~ /.well-known/ {
            charset utf-8;
            try_files $uri =404;
        }

        # Cache static assets — 1 year for immutable hashed assets
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
            expires 1y;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, immutable";
        }

        # Hidden files: 404, not 403. A 403 tells a scanner something is here.
        location ~ /\. {
            return 404;
        }
    }
}