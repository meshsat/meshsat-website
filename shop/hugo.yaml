# shop.meshsat.net: MeshSat Compact v2 (MSC-2). A second Hugo site in this repo,
# served by the meshsat-website nginx image as a second server block
# (MESHSAT-1517). One page, one switch: `ordering` below.
baseURL: "https://shop.meshsat.net/"
title: "MeshSat Compact v2"
languageCode: "en"
defaultContentLanguage: en
enableRobotsTXT: true
disableKinds:
  - taxonomy
  - term
  - RSS

params:
  description: "MeshSat Compact v2 (MSC-2): a Meshtastic-compatible LoRa radio and an Iridium satellite modem in one sealed case. One satellite gateway for the whole team. Built to order in Leiden."
  # off: the public page collects e-mail sign-ups only; no checkout URL is
  # rendered anywhere (verify-site.sh checks the built HTML). on: the Buy
  # button and the online withdrawal function appear. Owner's switch.
  ordering: "off"
  launch_price: "EUR 1.111"
  later_price: "EUR 1.800"
  vat_note: "incl. 21 % VAT"
  ship_window: "December 2026 to January 2027"
  # listmonk public form (MESHSAT-1519). Empty until the list exists: the page
  # then offers support@ instead of a form that would post nowhere.
  list_form_url: "https://list.meshsat.net/subscription/form"
  list_uuid: "92bb345f-c9ec-4b5e-91e2-ad24d5277227"
  # Cloudflare Turnstile on the sign-up form (owner's choice, 11 Oct 2026):
  # with a site key the form posts to notify_url (meshsat-shop verifies the
  # token with the widget's secret and subscribes through listmonk in the
  # cluster); empty, the form posts to listmonk directly with ALTCHA. The site
  # key is public by design; the secret is in OpenBao for the service.
  turnstile_site_key: "0x4AAAAAAFTgclBWnGTRJVoq"
  notify_url: "https://order.meshsat.net/notify"
  # A second illustration for the "why one gateway" section, only when it shows a
  # properly assembled device (owner, 11 Oct 2026). Empty = the slot collapses.
  why_image: ""
  why_image_caption: ""
  # External references the copy cites (the brief of 11 Oct 2026).
  airtime_url: "https://www.groundcontrol.com/products/iridium-messaging-transport-imt-pricing/"
  channels_url: "https://meshtastic.org/docs/configuration/radio/channels/"
  apps_url: "https://docs.meshsat.net/android/"
  # Kickstarter: empty = no link. Set the pre-launch page to show "Follow on
  # Kickstarter" beside the e-mail form; kickstarter_live flips the wording to
  # "Back us on Kickstarter". Never a pledge amount here.
  kickstarter_url: ""
  kickstarter_live: false
  # Rendered only when ordering is on (MESHSAT-1518 builds these on the Hub).
  checkout_url: "https://order.meshsat.net/shop/MSC-2"
  withdraw_url: "https://order.meshsat.net/shop/withdraw"
  conformity_url: "https://docs.meshsat.net/conformity/msc-2/"
  node_docs_url: "https://docs.meshsat.net/node/"
  intro_film: "Q-JKNwWlzpE"
  intro_film_time: "2:02"
  support_email: "support@meshsat.net"
  site_url: "https://meshsat.net"
  docs_url: "https://docs.meshsat.net"
  github: "https://github.com/meshsat"

# Fonts and the brand marks come from the main site: one copy in git, mounted
# into this build (Hugo allows a source outside the project). Nothing else of
# site/static is included.
module:
  mounts:
    - source: content
      target: content
    - source: layouts
      target: layouts
    - source: assets
      target: assets
    - source: static
      target: static
    - source: ../site/static/fonts
      target: static/fonts
    - source: ../site/static/images
      target: static/images
      includeFiles:
        - "/meshsat-mark-dark.png"
        - "/meshsat-mark-light.png"
        - "/og-image.jpg"
        - "/video-poster.jpg"
    - source: ../site/static
      target: static
      includeFiles:
        - "/favicon.svg"
        - "/apple-touch-icon.png"
        - "/.well-known/security.txt"

# In-page sections (the brief of 11 Oct 2026); Conformity, Docs and meshsat.net
# are in the footer. The call to action after them follows the ordering switch.
menu:
  main:
    - name: "How it works"
      url: "/#how-it-works"
      weight: 1
    - name: "The hardware"
      url: "/#the-hardware"
      weight: 2
    - name: "Build progress"
      url: "/#build-progress"
      weight: 3
    - name: "FAQ"
      url: "/#faq"
      weight: 4

markup:
  goldmark:
    renderer:
      unsafe: true

minify:
  disableHTML: false
  minifyOutput: true
  tdewolff:
    html:
      keepComments: true
      keepWhitespace: false
