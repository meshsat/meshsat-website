# Security headers for meshsat.net, included by the server block and by every
# location that adds a header of its own (nginx's add_header is not inherited
# past a location that sets any header). Copied to /etc/nginx/security-headers.conf
# by Dockerfile.site (MESHSAT-1610). $csp_value is the map in nginx-site.conf.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy $csp_value always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
