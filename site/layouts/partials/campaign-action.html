<a class="campaign-button{{ if eq .from "header" }} header-campaign{{ end }}" href="{{ .ctx.Site.Params.kickstarter_url }}" data-umami-event="kickstarter-click" data-umami-event-from="{{ .from }}" data-umami-event-locale="{{ .ctx.Site.Language.Lang }}" aria-label="{{ i18n (printf "campaign_%s_cta" .ctx.Site.Params.campaign_state) }}"><span class="campaign-label">{{ if ne .from "header" }}<span class="campaign-prefix">{{ i18n (printf "campaign_%s_prefix" .ctx.Site.Params.campaign_state) }}</span>{{ end }}<img class="campaign-wordmark" src="/images/kickstarter-logo-white-20261027.png" width="960" height="102" alt="Kickstarter"></span>{{ if ne .from "header" }}<svg class="campaign-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><path d="M7 17 17 7M7 7h10v10"/></svg>{{ end }}</a>
