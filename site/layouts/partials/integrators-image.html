<figure class="ig-concept-view {{ .class }}">
  <button class="shot-open ig-image-open" type="button" data-full="{{ .full }}" aria-label="{{ i18n "ig_enlarge" }}: {{ i18n .alt }}">
    <img src="{{ .small }}" srcset="{{ .small }} {{ .smallWidth }}w, {{ .full }} {{ .width }}w" sizes="{{ .sizes }}" width="{{ .width }}" height="{{ .height }}" alt="{{ i18n .alt }}" loading="lazy" decoding="async">
    <span class="ig-image-zoom" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M3 3l6 6m12-6-6 6M3 21l6-6m12 6-6-6"/></svg></span>
  </button>
  <figcaption><strong>MSC-3T / FUTURE PLAN.</strong> {{ i18n .caption }} <span>{{ i18n "ig_render_caption" }}</span></figcaption>
</figure>
