{{/* The one screenshot lightbox, shared by the home page, the integrators page
     and How we build (main.js steps through each [data-shots] set). Pass
     "class" for a page-specific skin (the integrators page adds
     ig-image-dialog). MESHSAT-1612 folded three copies into this file. */}}
<dialog class="shot-dialog{{ with .class }} {{ . }}{{ end }}" id="shot-dialog" aria-labelledby="shot-caption">
    <div class="shot-frame">
        <div class="shot-head">
            <span id="shot-caption" aria-live="polite"></span>
            <span class="shot-count" id="shot-count"></span>
            <button type="button" class="shot-close shot-nav" data-step="-1" aria-keyshortcuts="ArrowLeft" aria-label="{{ i18n "shot_prev" }}"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
            <button type="button" class="shot-close shot-nav" data-step="1" aria-keyshortcuts="ArrowRight" aria-label="{{ i18n "shot_next" }}" autofocus><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
            <button type="button" class="shot-close" aria-label="{{ i18n "lightbox_close" }}"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <img id="shot-img" alt="">
    </div>
</dialog>
