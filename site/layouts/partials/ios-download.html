{{ with .Site.Params.app_store_url }}
<aside class="ios-download" aria-labelledby="ios-download-title">
    <div>
        <h3 id="ios-download-title">MeshSat iOS</h3>
        <p>{{ i18n "ios_store_intro" }}</p>
        <p class="term-note">{{ i18n "ios_store_note" }}</p>
    </div>
    <div class="hero-actions">
        <div class="store-badges">{{ partial "store-badge.html" (dict "ctx" $ "store" "app-store") }}</div>
        <a href="{{ $.Site.Params.docs_url }}/ios/" class="btn btn-outline" target="_blank" rel="noopener">{{ i18n "ios_docs" }}</a>
    </div>
</aside>
{{ end }}
