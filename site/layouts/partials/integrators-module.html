{{/* Original neutral artwork. No vendor photograph, logo, PCB layout or CAD is reproduced. */}}
<svg class="ig-module-art" viewBox="0 0 240 200" role="img" aria-label="{{ .name }}: original MeshSat neutral illustration, not a product photograph">
  {{ $w := .width }}{{ $h := .height }}{{ $x := div (sub 240 $w) 2 }}{{ $y := div (sub 192 $h) 2 }}
  <g transform="translate({{ $x }} {{ $y }})" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
    <path class="ig-art-side" d="M0 {{ $h }} l12 10 h{{ $w }} V10 L{{ $w }} 0 v{{ $h }} Z"/>
    <rect class="ig-art-board" width="{{ $w }}" height="{{ $h }}" rx="4"/>
    {{ if eq .shape "chip" }}
      {{ range seq 1 6 }}{{ $p := mul . 12 }}<path d="M{{ $p }} 0 v-8 M{{ $p }} {{ $h }} v8 M0 {{ $p }} h-8 M{{ $w }} {{ $p }} h8"/>{{ end }}
      <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/>
      <rect x="20" y="25" width="{{ sub $w 40 }}" height="{{ sub $h 50 }}" rx="2" fill="none"/>
    {{ else if eq .shape "handheld" }}
      <rect x="12" y="14" width="{{ sub $w 24 }}" height="61" rx="3" class="ig-art-screen"/>
      <path d="M23 48 h10 l5 -12 7 22 5 -10 h5" fill="none"/>
      <circle cx="{{ div $w 2 }}" cy="106" r="15" fill="none"/>
      <circle cx="{{ div $w 2 }}" cy="106" r="5" fill="none"/>
      <rect x="15" y="-12" width="16" height="12" class="ig-art-shield"/>
    {{ else }}
      <rect x="14" y="14" width="{{ sub $w 40 }}" height="{{ sub $h 37 }}" rx="2" class="ig-art-shield"/>
      {{ if eq .shape "shield" }}
        {{ range seq 1 5 }}<path d="M22 {{ add 20 (mul . 9) }} h{{ sub $w 58 }}"/>{{ end }}
      {{ else if eq .shape "ethernet" }}
        <rect x="-7" y="15" width="35" height="36" class="ig-art-shield"/><rect x="-3" y="23" width="24" height="20" class="ig-art-screen"/>
      {{ else if eq .shape "sdr" }}
        <rect x="22" y="-15" width="18" height="15" class="ig-art-shield"/><rect x="{{ sub $w 44 }}" y="-15" width="18" height="15" class="ig-art-shield"/>
        <rect x="48" y="32" width="36" height="36" class="ig-art-board"/>
      {{ else if eq .shape "satellite" }}
        <rect x="{{ sub $w 25 }}" y="-13" width="16" height="20" class="ig-art-shield"/>
        <rect x="22" y="24" width="{{ sub $w 56 }}" height="{{ sub $h 60 }}" fill="none"/>
      {{ else }}
        <rect x="25" y="25" width="32" height="25" class="ig-art-board"/><path d="M68 25 h22 M68 34 h22 M68 43 h15"/>
      {{ end }}
      {{ range seq 1 6 }}<path d="M{{ add 15 (mul . 12) }} {{ sub $h 10 }} v8"/>{{ end }}
      {{ if ne .shape "stamp" }}<circle cx="7" cy="7" r="2.5" fill="none"/><circle cx="{{ sub $w 7 }}" cy="{{ sub $h 7 }}" r="2.5" fill="none"/>{{ end }}
    {{ end }}
  </g>
</svg>
