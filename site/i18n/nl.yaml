hero_eyebrow:
  other: "Open source routering tussen radio's die elkaar niet kunnen bereiken"
hero_title_a:
  other: "Eén bericht."
hero_title_b:
  other: "Elke weg naar buiten."
hero_sub:
  other: "Een mesh houdt een dorp met zichzelf in gesprek, maar heeft geen route het dal uit. Een satellietmodem bereikt de hele wereld en kost echt geld per bericht. MeshSat is de laag daartussen: het haalt een bericht van de mesh en verstuurt het via welke drager dan ook die nog werkt, en geeft pas satellietbytes uit als er niets gratis meer over is."
hero_status:
  other: "Prototype, nog niet uitgebracht. Nooit bij een echte gebruiker ingezet, nooit gebruikt bij een noodgeval."
hero_star:
  other: "Geef een ster op GitHub"
hero_visitors:
  other: "Bezoekers"
hero_donate:
  other: "Steun via Ko-fi"
trace_title:
  other: "Routeringslog, één noodbericht"
trace_bridge:
  other: "bridge tesseract"
trace_alt:
  other: "Voorbeeld van een routeringslog: een SOS komt binnen via LoRa mesh, de Iridium-poging mislukt omdat de satelliet onder de horizon staat, en het bericht wordt in plaats daarvan bezorgd via sms, TAK en MQTT."
t1:
  other: "SOS van node !a4f2c1, 17 bytes"
t2:
  other: "3 regels overeen, 4 routes gekozen"
t3:
  other: "onder de horizon, volgende passage over 11m 38s"
t4:
  other: "smaz2 17 naar 11 bytes, sms naar contactgroep"
t5:
  other: "positie als Cursor-on-Target, parallel"
t6:
  other: "vastgelegd voor dashboard en webhooks"
trace_foot:
  other: "De satellietverbinding mislukte en het bericht kwam toch aan. Dat is het hele product. Routes, failover-volgorde en transformatieketens worden per interface ingesteld."
tr_title:
  other: "Acht dragers, negen bedrade interfaces"
tr_sub:
  other: "Iridium draait op twee modems, de 9603N voor SBD en de 9704 voor IMT. Elke drager is een volwaardige interface met een eigen MTU, kostenmodel en transformatieketen. TAK en webhooks zijn integraties, geen dragers. De status zegt wat we werkelijk hebben gedraaid, niet wat we hopen."
