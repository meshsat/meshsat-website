tx_rns:
  other: "Reticulum TCP (HDLC-frames)"
tr_note_a:
  other: "Bundeling over meerdere dragers via een betaalde satellietverbinding is nog niet gevalideerd, en de stoordetectie heeft alleen nog omgevingsruis gezien."
tr_note_link:
  other: "De repository geeft de volledige lijst"
tr_note_b:
  other: "van wat wel en niet bewezen is."
cost_title:
  other: "Neem de goedkoopste route die nog werkt."
cost_sub:
  other: "Een Iridium-abonnement kost tientallen euro's per maand plus credits per bericht, afgerekend in blokken van 340 bytes. Geef er iedereen in een team één en de rekening groeit mee met het aantal mensen. Die prijs bepaalt elke routeringsbeslissing."
c1_h:
  other: "Eén betaalde verbinding, gedeeld"
c1_p:
  other: "Een team draagt goedkope mesh-radio's. Eén gateway houdt de dure satellietverbinding. Iedereen bereikt de buitenwereld daardoorheen, zodat de kosten niet meer meegroeien met het aantal mensen."
c2_h:
  other: "Eerst de gratis dragers"
c2_p:
  other: "Elke interface geeft een kostprijs op. De router kiest bij voorkeur de gratis dragers, mesh, packet radio, Bluetooth en wifi, en grijpt pas naar satelliet of sms als er niets gratis beschikbaar is."
c3_h:
  other: "En dan zo min mogelijk bytes"
c3_p:
  other: "Alles wat via een betaalde drager vertrekt, wordt eerst gecomprimeerd. SMAZ2 doet dat in minder dan een milliseconde bij korte tekst, wat telt als je per blok betaalt en niet per byte."
c4_h:
  other: "Verstuurd als de hemel goed staat"
c4_p:
  other: "Passagevoorspelling op basis van SGP4-baangegevens houdt verkeer vast tot een zichtbaarheidsvenster, in plaats van batterij te verspillen aan pogingen richting een satelliet die onder de horizon staat."
funding_a:
  other: "MeshSat is vrije software onder de GPLv3. De ontwikkeling wordt ondersteund door"
funding_b:
  other: ", en een veldprogramma van zes maanden begint in november 2026."
hw_title:
  other: "Waar het op draait"
hw_sub:
  other: "Een Raspberry Pi in een waterdichte koffer met radio's op USB en GPIO. Apparaten worden bij het opstarten herkend aan hun USB-id en een protocoltest, dus aansluiten is de hele configuratie."
th_part:
  other: "Onderdeel"
th_role:
  other: "Rol"
hw1:
  other: "Host. ARM64, of elke x86_64 Linux met Docker en USB-serieel."
hw2:
  other: "Meshtastic mesh-radio op 868 of 915 MHz."
hw3:
  other: "Iridium-satelliet. SBD met 340 bytes, of IMT met 100 KB."
hw4:
  other: "4G en 2G mobiel, voor sms en data."
hw5:
  other: "ZigBee-coördinator."
hw6:
  other: "UPS en accu"
hw6r:
  other: "Omdat de interessante gevallen juist die zijn waarin ook de netstroom is weggevallen."
cap1:
  other: "Spectrum per band, verbindingen en de gezondheid van elke drager, geserveerd door het apparaat zelf"
cap2:
  other: "Passagevoorspelling, zodat de wachtrij wacht op een satelliet die er echt is"
cap3:
  other: "Zes uur van de 868 MHz LoRa-band. De stoordetectie heeft alleen nog omgevingsruis gezien."
cap4:
  other: "Een ZigBee-sensor voor temperatuur en luchtvochtigheid, en zijn laatste 24 uur"
hw_note:
  other: "Het dashboard zit in de binary en wordt vanaf het apparaat geserveerd. Geen cloud, geen account."
hw_repo_a:
  other: "De hardware heeft een eigen repository, "
hw_repo_b:
  other: ": de twee tot nu toe gebouwde kits met hun bouwhandleiding, en de V2-dragerprinten voor een Peli 1520-koffer, ontworpen en klaar voor fabricage maar nog niet gebouwd."
nf_title:
  other: "Wat het niet is"
nf_sub:
  other: "Starlink is connectiviteit, Meshtastic een lokale mesh, Reticulum een netwerk dat over elke drager loopt, TAK een gedeelde kaart van de situatie. MeshSat vervangt geen van allen. Het brengt berichten tussen ze over."
nf1_h:
  other: "Geen vervanging van Starlink"
nf1_p:
  other: "MeshSat verplaatst tekst, posities en telemetrie. Wil je videobellen of het web, gebruik dan Starlink. Dit is voor de gevallen die een schotel niet aankan: op accu, zakformaat, zonder netstroom."
nf2_h:
  other: "Geen spraak of video"
nf2_p:
  other: "Satelliet- en meshverbindingen hebben hoge vertraging en lage doorvoer. Dit is store and forward berichtenverkeer. Denk aan sms, niet aan bellen."
nf3_h:
  other: "Geen LoRaWAN-netwerkserver"
nf3_p:
  other: "De meshkant spreekt Meshtastic, een eigen protocol over LoRa. Gebruik voor LoRaWAN ChirpStack en koppel dat via MQTT."
nf4_h:
  other: "Geen hulpdienst"
nf4_p:
  other: "Een onderzoeksprototype, geen vervanging van 112 of enig ander nationaal alarmnummer. Niets hiervan is gecertificeerd en niets hiervan is bij een echt noodgeval gebruikt."
sys_title:
  other: "De rest van het systeem"
sys_sub:
  other: "De Bridge is één apparaat en werkt volledig zelfstandig. Er zijn twee andere onderdelen voor als één apparaat niet het hele verhaal is."
