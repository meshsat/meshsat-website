ig_modules_intro:
  other: "De onderstaande gegevens beschrijven componenten van de fabrikanten, geen voltooide MSC-3. Elke kandidaat heeft een bronverwijzing. Gepubliceerde radiomogelijkheden bepalen niet welke instellingen wettelijk zijn toegestaan."

ig_art_credit:
  other: "Illustraties: oorspronkelijk neutraal beeldwerk van MeshSat. Vereenvoudigde vormen, niet op schaal; geen productfoto's, printplaatontwerpen of assemblagetekeningen. Fabrikantnamen dienen uitsluitend om componenten te identificeren en impliceren geen samenwerking of goedkeuring."

