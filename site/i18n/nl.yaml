is_title:
  other: "Netwerken vallen uiteen in eilanden"
is_sub:
  other: "Een ramp legt zelden alle systemen tegelijk stil. Hij verbreekt de verbindingen ertussen: de radio blijft werken binnen één dienst of één cel, het telefoonnet valt weg, en wat het ene team weet bereikt het team dat het nodig heeft niet."
is_record_h:
  other: "Het is eerder gebeurd"
is_joins_h:
  other: "Hoe verbinden eruitziet"
is_to:
  other: "naar"
join1_h:
  other: "Twee teams op twee meshes, geen internet"
join1_s:
  other: "Op 12 september 2026 van kit naar kit getest via APRS en daarna via sms. Zie de film over de veldkits hierboven."
join2_h:
  other: "Een dal zonder bereik, een kantoor ver weg"
join2_s:
  other: "De satellietverbinding is bevestigd over een echte Iridium-link, maart 2026."
join3_h:
  other: "Een radionet van vrijwilligers en een commandopost"
join3_s:
  other: "Beide interfaces zijn in het veld getest. Deze route is nog niet van begin tot eind gedraaid."
is_who:
  other: "Gebouwd voor de mensen die tussen die eilanden werken: zoek- en reddingsteams, crisisbeheersing en civiele bescherming, humanitaire organisaties, noodnetten van zendamateurs, expedities, bemanningen op zee en industrie op afgelegen plekken. Geen van hen gebruikt het nog; het veldprogramma dat in november 2026 begint is de eerste echte test."
inc1_h:
  other: "Orkaan Katrina, Golfkust van de VS."
inc1_p:
  other: "In veel gevallen konden hulpverleners van verschillende diensten elkaar niet bereiken door onverenigbare frequentietoewijzingen. Een militaire helikopter moest een briefje in een fles afwerpen om hen voor een gaslek te waarschuwen."
inc1_src:
  other: "rapport van het FCC-panel"
inc2_h:
  other: "Overstromingen in het Ahrdal en de Eifel, Duitsland."
inc2_p:
  other: "34 basisstations van het noodradionet werden getroffen. In terugvalmodus bleef de radio alleen binnen de eigen cel van elk station werken, en verbindingen daarbuiten werden per geval hersteld, bijvoorbeeld met gatewayverbindingen."
inc2_src:
  other: "Landtag Rheinland-Pfalz, Drucksache 18/1947"
inc3_h:
  other: "Bosbrand in Lahaina, Maui."
inc3_p:
  other: "Het radiosysteem van de hulpdiensten van de county lijkt de hele tijd te hebben gewerkt, maar de politie kon de brandweerkanalen niet horen en de brandweer de politie niet, en onbetrouwbaar mobiel bereik liet particuliere watertankers zonder coördinatie."
inc3_src:
  other: "FSRI-rapport voor de procureur-generaal van Hawaï"
inc4_h:
  other: "Stroomstoring in Spanje en Portugal."
inc4_p:
  other: "Het openbare vaste en mobiele telefoonnet viel uit, en de Portugese distributienetbeheerder week uit naar satelliettelefoons. De Spaanse netbeheerder kon nog bellen maar het distributiecentrum in Sevilla niet bereiken, en het herstel van de stroomvoorziening in Andalusië werd gepauzeerd."
inc4_src:
  other: "rapport van het ENTSO-E-expertpanel"
