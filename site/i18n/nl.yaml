ig_cases_title:
  other: "Integratiescenario's"

ig_cases_intro:
  other: "Dit zijn onderzoeksscenario's. Er wordt geen inzet bij klanten, compatibiliteit met een radiovloot of operationele goedkeuring geclaimd."

ig_case_tl_title:
  other: "TETRA-teams en een vrijwilligersmesh"

ig_case_tl_body:
  other: "Evalueer de uitwisseling van geselecteerde tekst- en positiegegevens tussen een professioneel radioteam en vrijwilligers met Meshtastic, met Iridium voor rapportage op afstand. Routeringsbeleid bepaalt wat de grens mag passeren."

ig_case_td_title:
  other: "Teams met verschillende radiosystemen"

ig_case_td_body:
  other: "Evalueer berichtenuitwisseling tussen TETRA- en DMR-teams in directe modus. Vlootspecifieke gegevensformaten, kanaaltoestemming en de omgang met versleuteling moeten eerst worden vastgesteld."

ig_case_dl_title:
  other: "DMR-teams en lokale sensoren"

ig_case_dl_body:
  other: "Evalueer DMR-tekst en ondersteunde locatiegegevens naast veldrapportages via Meshtastic. Test welke berichttypen kunnen worden omgezet en doorgestuurd via de gedeelde satellietroute."

