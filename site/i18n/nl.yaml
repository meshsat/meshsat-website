host_lead:
  other: "De Hub beheert veel bridges vanaf één plek: accounts met rollen, API-sleutels, SOS-escalatieketens en een auditlog waarin elke wijziging zichtbaar is. De code is in beide gevallen dezelfde. Wat verschilt is wie hem draait en hoeveel apparaten je kunt registreren."
