hero_eyebrow:
  other: "Als netwerken uitvallen, valt wat overblijft uiteen in eilanden. MeshSat verbindt ze."
hero_title_a:
  other: "Eén bericht."
hero_title_b:
  other: "Elke weg naar buiten."
hero_sub:
  other: "Een mesh die één dal met zichzelf laat praten, een radionet van vrijwilligers, een satellietmodem, de kaart van een commandopost: elk werkt misschien nog, en geen ervan bereikt de andere. MeshSat is open source software die een bericht van het ene haalt en in het andere aflevert via welke drager dan ook die nog werkt, en pas satellietbytes uitgeeft als er niets gratis meer over is."
hero_status:
  other: "Hub open. Nog geen vloot actief, nooit gebruikt bij een echt noodgeval."
hero_star:
  other: "Geef een ster op GitHub"
hero_visitors:
  other: "Bezoekers"
hero_donate:
  other: "Steun MeshSat"
trace_title:
  other: "Routeringslog, één noodbericht"
trace_bridge:
  other: "bridge tesseract"
trace_alt:
  other: "Voorbeeld van een routeringslog: een SOS komt binnen via LoRa mesh, de Iridium-poging mislukt omdat de satelliet onder de horizon staat, en het bericht wordt in plaats daarvan bezorgd via sms, TAK en MQTT."
t1:
  other: "SOS van node !a4f2c1, 17 bytes"
t2:
  other: "3 regels overeen, 4 routes gekozen"
t3:
  other: "onder de horizon, volgende passage over 11m 38s"
t4:
  other: "smaz2 17 naar 11 bytes, sms naar contactgroep"
t5:
  other: "positie als Cursor-on-Target, parallel"
t6:
  other: "vastgelegd voor dashboard en webhooks"
trace_foot:
  other: "De satellietverbinding mislukte en het bericht kwam toch aan, in drie systemen die de mesh zelf niet kan bereiken. Routes, failover-volgorde en transformatieketens worden per interface ingesteld."
tr_title:
  other: "Elk systeem sluit aan op dezelfde router"
tr_sub:
  other: "Elk systeem is een adapter achter dezelfde interface, met een eigen MTU, kostenmodel en transformatieketen, en een regel kan van elke adapter naar elke andere routeren. Vandaag draaien acht dragers op negen interfaces, omdat Iridium twee keer telt, op de 9603N en de 9704. HF-radio en DMR staan op de roadmap en zijn niet gebouwd. De status zegt wat we werkelijk hebben gedraaid, niet wat we hopen."
