  other: "PlutoSDR met Osmocom"

ig_radio_g_limit:
  other: "Vergunning per locatie. Elke inzet vereist een eigen zendmachtiging. SIM-inrichting, spectrum, timing, RF-filtering en rekencapaciteit moeten worden gevalideerd. Dit is een lokale cel, geen roaming op openbare netwerken."

