and_p:
  other: "Een gewone Android-telefoon wordt de gateway, zonder Pi. Gekoppeld aan een MeshSat-node op zakformaat bereikt één Bluetooth-verbinding zowel de meshradio als het Iridium-modem, en de volledige APK-versie voegt sms toe via de eigen simkaart van de telefoon. Satellietberichten wachten in een wachtrij op de volgende overgang, die de telefoon zonder internet voorspelt."
