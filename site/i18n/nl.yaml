ig_radio_t_limit:
  other: "Vergunde TETRA-kanalen. Interoperabiliteit van SDS, status en locatie in directe modus moet met de teamradio's worden gevalideerd. Directe modus op de BDM 31 3L is niet bevestigd."

ig_radio_d_data:
  other: "Tekst; status en posities zijn afhankelijk van module en radiovloot"

ig_radio_d_limit:
  other: "Vergunde DMR-kanalen. Tekstformaten, locatieprotocollen en versleuteling verschillen per radiovloot. De openbare commandolijst van NiceRF documenteert geen locatiecommando. Gegevensuitwisseling en versleuteling tussen fabrikanten zijn niet geverifieerd."

ig_radio_l_data:
  other: "Meshtastic-tekst- en positiepakketten"

ig_radio_l_modules:
  other: "Radio op basis van Semtech SX1262"

ig_radio_l_limit:
  other: "Regionale beperkingen voor frequentieband, zendvermogen en dutycycle gelden. Een Meshtastic-host en compatibele firmware zijn vereist; de SX1262-chip alleen draait geen Meshtastic."

ig_radio_a_data:
  other: "Tekst, status en posities voor amateurradio"

ig_radio_a_limit:
  other: "Uitsluitend amateurradio. Een bevoegde zendamateur is vereist. Geen versleuteling. Niet voor verkeer van overheidsdiensten; routes naar APRS moeten deze grens afdwingen."

ig_radio_h_data:
  other: "Geselecteerde applicatieberichten via een lokale IP-verbinding"

ig_radio_h_limit:
  other: "Regionale band- en vermogensgrenzen gelden. Vereist compatibele HaLow-apparaten. De satellietroute vervoert geselecteerde berichten, geen breedband-IP-verbinding. Bordkeuze en hostintegratie worden geëvalueerd."

