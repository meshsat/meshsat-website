is_title:
  other: "Networks fail into islands"
is_sub:
  other: "A disaster rarely silences every system at once. It cuts the links between them: radio keeps working inside one agency or one cell, the phone network goes, and what one team knows does not reach the team that needs it."
is_record_h:
  other: "It has happened before"
is_joins_h:
  other: "What joining them looks like"
is_to:
  other: "to"
join1_h:
  other: "Two teams on two meshes, no internet"
join1_s:
  other: "Run kit to kit on 12 September 2026 over APRS, then over SMS. It is the second film below."
join2_h:
  other: "A valley with no signal, an office far away"
join2_s:
  other: "The satellite leg is verified over a real Iridium link, March 2026."
join3_h:
  other: "A volunteer radio net and a command post"
join3_s:
  other: "Both interfaces are field tested. This route has not been run end to end yet."
is_who:
  other: "Built for the people who work between those islands: search and rescue teams, civil protection and emergency management, humanitarian organisations, amateur radio emergency groups, expeditions, maritime crews and remote industry. None of them runs it yet; the field programme that starts in November 2026 is its first real test."
inc1_h:
  other: "Hurricane Katrina, US Gulf Coast."
inc1_p:
  other: "In many cases responders in different agencies could not talk to each other because of incompatible frequency assignments. A military helicopter had to drop a message in a bottle to warn them of a gas leak."
inc1_src:
  other: "FCC panel report"
inc2_h:
  other: "Floods in the Ahr valley and the Eifel, Germany."
inc2_p:
  other: "34 emergency radio base stations were affected. In fallback mode radio kept working only inside each station's own cell, and links beyond it were patched case by case, for example with gateway connections."
inc2_src:
  other: "Landtag Rheinland-Pfalz, Drucksache 18/1947"
inc3_h:
  other: "Lahaina wildfire, Maui."
inc3_p:
  other: "The county's public safety radio system appears to have worked throughout, but police could not hear fire channels and fire could not hear police, and unreliable cell service left private water tankers uncoordinated."
inc3_src:
  other: "FSRI report for the Hawaii Attorney General"
inc4_h:
  other: "Blackout in Spain and Portugal."
inc4_p:
  other: "Public phone and mobile networks failed, and Portugal's distribution operator fell back on satellite phones. Spain's grid operator could still make calls but could not reach the distribution control centre in Seville, and restoring supply in Andalusia was paused."
inc4_src:
  other: "ENTSO-E expert panel report"
