tr_note_a:
  other: "Multi-bearer bonding over a paid satellite link is not validated yet, and the jamming detector has only ever seen ambient noise."
tr_note_link:
  other: "The repository sets out the full list"
tr_note_b:
  other: "of what has and has not been proven."
cost_title:
  other: "Use the cheapest path that still works."
cost_sub:
  other: "An Iridium line costs tens of euros a month plus credits per message, billed per credit at 50 bytes a credit. Give one to every person in a team and the bill scales with headcount. That price shapes every routing decision."
c1_h:
  other: "One paid link, shared"
c1_p:
  other: "A team carries cheap mesh radios. One gateway holds the expensive satellite line. Everyone reaches the outside through it, so cost stops scaling with the number of people."
c2_h:
  other: "Free bearers first"
c2_p:
  other: "Every interface declares a cost. The router prefers the free ones, mesh, packet radio, Bluetooth and Wi-Fi, and only reaches for satellite or SMS when nothing free is up."
c3_h:
  other: "Fewer bytes when it does"
c3_p:
  other: "Anything leaving on a metered bearer is compressed first. SMAZ2 runs in under a millisecond on short text, which matters when you are billed per credit rather than per byte."
c4_h:
  other: "Sent when the sky is right"
c4_p:
  other: "Pass prediction from SGP4 orbital elements holds traffic for visibility windows instead of burning battery retrying against a satellite that is below the horizon."
funding_a:
  other: "The Bridge is free software under the GPLv3, the Hub under Apache 2.0. Development is supported by"
funding_b:
  other: ", and a six month field programme starts in November 2026."
hw_title:
  other: "What it runs on"
hw_sub:
  other: "Start with a Linux host and one USB mesh radio. Add satellite, SMS or sensors when you need them; configure a route for each link."
th_part:
  other: "Part"
th_role:
  other: "Role"
hw1:
  other: "Host. ARM64, or any x86_64 Linux with Docker and USB serial."
hw2:
  other: "Meshtastic mesh radio at 868 or 915 MHz."
hw3:
  other: "Iridium satellite. SBD at 340 bytes, or IMT at 100 KB."
hw4:
  other: "4G and 2G cellular, for SMS and data."
hw5:
  other: "ZigBee coordinator."
hw6:
  other: "UPS and battery"
hw6r:
  other: "Because the interesting cases are the ones where mains power has gone too."
cap1:
  other: "Spectrum per band, links and every bearer's health, served by the device itself"
cap2:
  other: "Pass prediction, so the queue waits for a satellite that is actually up"
cap3:
  other: "Six hours of the 868 MHz LoRa band. The jamming detector has only ever seen ambient noise."
cap4:
  other: "A ZigBee temperature and humidity sensor and its last 24 hours"
hw_note:
  other: "The dashboard is embedded in the binary and served from the device. No cloud dependency, no account."
hw_repo_a:
  other: "The hardware has its own repository, "
hw_repo_b:
  other: ": build guides for the two V1 kits, and the unbuilt V2 design for a Peli 1450 case. V2 is still under engineering review, not ready to order."
nf_title:
  other: "What it is not"
nf_sub:
  other: "Starlink is connectivity, Meshtastic a local mesh, Reticulum a network that runs over any bearer, TAK a shared map of the situation. MeshSat replaces none of them. It carries messages between them."
nf1_h:
  other: "Not a Starlink replacement"
nf1_p:
  other: "MeshSat moves text, positions and telemetry. If you need video calls or the web, use Starlink. This is for the cases a dish cannot serve: battery powered, pocket sized, no mains."
nf2_h:
  other: "Not voice or video"
nf2_p:
  other: "Satellite and mesh links are high latency and low throughput. This is store and forward messaging. Think SMS, not a phone call."
nf3_h:
  other: "Not a LoRaWAN network server"
nf3_p:
  other: "The mesh side speaks Meshtastic, which is its own protocol over LoRa. For LoRaWAN, run ChirpStack and bridge it in over MQTT."
nf4_h:
  other: "Not an emergency service"
nf4_p:
  other: "A research prototype, not a replacement for 112, 911 or any national emergency number. Nothing here is certified and nothing here has been used in a real emergency."
