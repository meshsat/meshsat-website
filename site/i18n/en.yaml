cost_title:
  other: "Satellite bytes are expensive. That is the whole design."
cost_sub:
  other: "An Iridium line costs tens of euros a month plus credits per message, billed in 340 byte blocks. Give one to every person in a team and the bill scales with headcount. That price shapes every routing decision."
c1_h:
  other: "One paid link, shared"
c1_p:
  other: "A team carries cheap mesh radios. One gateway holds the expensive satellite line. Everyone reaches the outside through it, so cost stops scaling with the number of people."
c2_h:
  other: "Free bearers first"
c2_p:
  other: "Every interface declares a cost. The router prefers the free ones, mesh, packet radio, Bluetooth and WiFi, and only reaches for satellite or SMS when nothing free is up."
c3_h:
  other: "Fewer bytes when it does"
c3_p:
  other: "Anything leaving on a metered bearer is compressed first. SMAZ2 runs in under a millisecond on short text, which matters when you are billed per block rather than per byte."
c4_h:
  other: "Sent when the sky is right"
c4_p:
  other: "Pass prediction from SGP4 orbital elements holds traffic for visibility windows instead of burning battery retrying against a satellite that is below the horizon."
funding_a:
  other: "MeshSat is free software under the GPLv3. Development is supported by"
funding_b:
  other: ", and a six month field programme starts in November 2026."
hw_title:
  other: "What it runs on"
hw_sub:
  other: "A Raspberry Pi in a waterproof case with radios on USB and GPIO. Devices are identified at startup by USB ID and protocol probe, so plugging one in is the whole configuration step."
th_part:
  other: "Part"
th_role:
  other: "Role"
hw1:
  other: "Host. ARM64, or any x86_64 Linux with Docker and USB serial."
hw2:
  other: "Meshtastic mesh radio at 868 or 915 MHz."
hw3:
  other: "Iridium satellite. SBD at 340 bytes, or IMT at 100 KB."
hw4:
  other: "4G and 2G cellular, for SMS and data."
hw5:
  other: "ZigBee coordinator."
hw6:
  other: "UPS and battery"
hw6r:
  other: "Because the interesting cases are the ones where mains power has gone too."
cap1:
