hero_eyebrow:
  other: "When networks fail, what survives becomes islands. MeshSat connects them."
hero_title_a:
  other: "One message."
hero_title_b:
  other: "Every way out."
hero_sub:
  other: "A mesh that keeps one valley talking, a volunteer radio net, a satellite modem, a command post's map: each can still work, and none can reach the others. MeshSat is open source software that takes a message off one and delivers it into another by whatever bearer is still alive, spending satellite bytes only when nothing free is left."
hero_status:
  other: "Hub open. No fleet running on it yet, never used in a real emergency."
hero_star:
  other: "Star on GitHub"
hero_visitors:
  other: "Visitors"
hero_donate:
  other: "Support MeshSat"
trace_title:
  other: "Routing trace, one distress message"
trace_bridge:
  other: "bridge tesseract"
trace_alt:
  other: "Example routing trace: an SOS arrives over LoRa mesh, the Iridium leg fails because the satellite is below the horizon, and the message is delivered by cellular SMS, TAK and MQTT instead."
t1:
  other: "SOS from node !a4f2c1, 17 bytes"
t2:
  other: "3 rules matched, 4 routes selected"
t3:
  other: "below horizon, next pass in 11m 38s"
t4:
  other: "smaz2 17 to 11 bytes, SMS to contact group"
t5:
  other: "position as Cursor-on-Target, in parallel"
t6:
  other: "logged for dashboard and webhooks"
trace_foot:
  other: "The satellite leg failed and the message still arrived, in three systems the mesh cannot reach on its own. Routes, failover order and transform chains are configured per interface."
tr_title:
  other: "Eight bearers, nine wired interfaces"
tr_sub:
  other: "Every system plugs in as an adapter behind one interface, with its own MTU, cost model and transform pipeline, and a rule can route from any adapter to any other. Iridium counts twice, on the 9603N and the 9704; TAK and webhooks are integrations rather than bearers. HF radio and DMR are on the roadmap and not built. Status says what we have actually run, not what we hope."
