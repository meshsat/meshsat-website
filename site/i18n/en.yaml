tx_rns:
  other: "Reticulum TCP (HDLC framed)"
tr_note_a:
  other: "Multi-bearer bonding over a paid satellite link is not validated yet, and the jamming detector has only ever seen ambient noise."
tr_note_link:
  other: "The repository sets out the full list"
tr_note_b:
  other: "of what has and has not been proven."
cost_title:
  other: "Satellite bytes are expensive. That is the whole design."
cost_sub:
  other: "An Iridium line costs tens of euros a month plus credits per message, billed in 340 byte blocks. Give one to every person in a team and the bill scales with headcount. That price is the reason the routing layer exists at all."
c1_h:
  other: "One paid link, shared"
c1_p:
  other: "A team carries cheap mesh radios. One gateway holds the expensive satellite line. Everyone reaches the outside through it, so cost stops scaling with the number of people."
c2_h:
  other: "Free bearers first"
c2_p:
  other: "Every interface declares a cost. The router prefers the free ones, mesh, packet radio, Bluetooth and WiFi, and only reaches for satellite or SMS when nothing free is up."
c3_h:
  other: "Fewer bytes when it does"
c3_p:
  other: "Anything leaving on a metered bearer is compressed first. SMAZ2 runs in under a millisecond on short text, which matters when you are billed per block rather than per byte."
c4_h:
  other: "Sent when the sky is right"
c4_p:
  other: "Pass prediction from SGP4 orbital elements holds traffic for visibility windows instead of burning battery retrying against a satellite that is below the horizon."
funding_a:
  other: "MeshSat is free software under the GPLv3. Development is supported by"
funding_b:
  other: ", and a six month field programme starts in November 2026."
hw_title:
  other: "What it runs on"
hw_sub:
  other: "A Raspberry Pi in a waterproof case with radios on USB and GPIO. Devices are identified at startup by USB ID and protocol probe, so plugging one in is the whole configuration step."
th_part:
  other: "Part"
th_role:
  other: "Role"
hw1:
  other: "Host. ARM64, or any x86_64 Linux with Docker and USB serial."
hw2:
  other: "Meshtastic mesh radio at 868 or 915 MHz."
hw3:
  other: "Iridium satellite. SBD at 340 bytes, or IMT at 100 KB."
hw4:
  other: "4G and 2G cellular, for SMS and data."
hw5:
  other: "ZigBee coordinator."
hw6:
  other: "UPS and battery"
hw6r:
  other: "Because the interesting cases are the ones where mains power has gone too."
cap1:
  other: "Signal, traffic and channel health, served by the device itself"
cap2:
  other: "Pass prediction, so the queue waits for a satellite that is actually up"
cap3:
  other: "Live mesh topology"
cap4:
  other: "Forwarding rules and per-gateway status"
hw_note:
  other: "The dashboard is embedded in the binary and served from the device. No cloud dependency, no account."
hw_repo_a:
  other: "The hardware has its own repository, "
hw_repo_b:
  other: ": the two kits built so far with their build guide, and the V2 carrier boards for a Peli 1520 case, designed and prepared for fabrication but not built yet."
nf_title:
  other: "What it is not"
nf_sub:
  other: "The fastest way to waste an afternoon is to expect the wrong thing from it."
nf1_h:
  other: "Not a Starlink replacement"
nf1_p:
  other: "MeshSat moves text, positions and telemetry. If you need video calls or the web, use Starlink. This is for the cases a dish cannot serve: battery powered, pocket sized, no mains."
nf2_h:
  other: "Not voice or video"
nf2_p:
  other: "Satellite and mesh links are high latency and low throughput. This is store and forward messaging. Think SMS, not a phone call."
nf3_h:
  other: "Not a LoRaWAN network server"
nf3_p:
  other: "The mesh side speaks Meshtastic, which is its own protocol over LoRa. For LoRaWAN, run ChirpStack and bridge it in over MQTT."
nf4_h:
  other: "Not an emergency service"
nf4_p:
  other: "A research prototype, not a replacement for 112, 911 or any national emergency number. Nothing here is certified and nothing here has been used in a real emergency."
sys_title:
  other: "The rest of the system"
sys_sub:
  other: "The Bridge is one device and works entirely on its own. Two other pieces exist for when one device is not the whole picture."
hub_badge:
  other: "Private beta"
hub_status:
  other: "MeshSat Hub is not launched yet. It runs as a private beta on our own infrastructure. Access for demos and beta testing is arranged on request."
hub_p:
  other: "Fleet management across many bridges: OAuth2 and OIDC accounts, API keys with roles, multi-tenant isolation, SOS escalation chains, per-device rate limits and an Ed25519 hash-chain audit log. Deployable standalone, clustered, or on Kubernetes."
hub_cta:
  other: "Request beta access"
and_p:
  other: "A phone as a standalone gateway, with no Pi and no cables. It talks to a Meshtastic radio over Bluetooth LE, an Iridium modem over Bluetooth SPP, and uses the phone's own SMS, all at the same time. Same encryption and message formats as the Bridge."
and_cta:
  other: "Android source"
cta_title:
  other: "Try it"
cta_sub:
  other: "One command on a Linux machine with a radio plugged into it. A single device is enough to start, and anything missing is logged as a warning rather than an error."
cta_source:
