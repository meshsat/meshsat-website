hero_eyebrow:
  other: "When networks fail, what survives becomes islands. MeshSat connects them."
hero_title_a:
  other: "One message."
hero_title_b:
  other: "Every way out."
hero_sub:
  other: "Open source software that carries messages between mesh radios, satellite links and mobile networks. Run it on a Linux gateway or a phone, and connect systems that cannot reach each other on their own."
hero_status:
  other: "Prototypes under development. Never used in a real emergency."
