trace_foot:
  other: "The satellite leg failed and the message still arrived, in three systems the mesh cannot reach on its own. Routes, failover order and transform chains are configured per interface."
tr_title:
  other: "Every system plugs into the same router"
tr_sub:
  other: "Each one is an adapter behind the same interface, with its own MTU, cost model and transform pipeline, and a rule can route from any adapter to any other. The code on each channel says where it really stands, not what we hope: only LIVE is tested and working on our hardware."
