hero_eyebrow:
  other: "Open source routing across radios that cannot reach each other"
hero_title_a:
  other: "One message."
hero_title_b:
  other: "Every way out."
hero_sub:
  other: "A mesh keeps a village talking to itself but has no route out of the valley. A satellite modem reaches anywhere and costs real money per message. MeshSat is the layer in between: it takes a message off the mesh and sends it by whatever bearer is still alive, spending satellite bytes only when nothing free is left."
hero_status:
  other: "Pre-release prototype. Never deployed to a real user, never used in an emergency."
hero_star:
  other: "Star on GitHub"
hero_visitors:
  other: "Visitors"
hero_donate:
  other: "Support on Ko-fi"
trace_title:
  other: "Routing trace, one distress message"
trace_bridge:
  other: "bridge tesseract"
trace_alt:
  other: "Example routing trace: an SOS arrives over LoRa mesh, the Iridium leg fails because the satellite is below the horizon, and the message is delivered by cellular SMS, TAK and MQTT instead."
t1:
  other: "SOS from node !a4f2c1, 17 bytes"
t2:
  other: "3 rules matched, 4 routes selected"
t3:
  other: "below horizon, next pass in 11m 38s"
t4:
  other: "smaz2 17 to 11 bytes, SMS to contact group"
t5:
  other: "position as Cursor-on-Target, in parallel"
t6:
  other: "logged for dashboard and webhooks"
trace_foot:
  other: "The satellite leg failed and the message still arrived. That is the whole product. Routes, failover order and transform chains are configured per interface."
tr_title:
  other: "Eight bearers, nine wired interfaces"
tr_sub:
  other: "Iridium runs on two modems, the 9603N for SBD and the 9704 for IMT. Every bearer is a first-class interface with its own MTU, cost model and transform pipeline. TAK and webhooks are integrations rather than bearers. Status says what we have actually run, not what we hope."
