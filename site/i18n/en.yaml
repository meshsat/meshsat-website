plans_keeps:
  other: "A device you have registered keeps working on any plan. A smaller plan only stops you adding more, and an SOS is never affected."
and_p:
  other: "A phone as a standalone gateway, with no Pi and no cables. It talks to a Meshtastic radio over Bluetooth LE, an Iridium modem over Bluetooth SPP, and uses the phone's own SMS, all at the same time. Same encryption and message formats as the Bridge."
