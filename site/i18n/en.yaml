and_p:
  other: "An ordinary Android phone becomes the gateway, with no Pi. Paired with a pocket MeshSat node, one Bluetooth link reaches both the mesh radio and the Iridium modem, and the full APK edition adds SMS through the phone's own SIM. Satellite messages wait in a queue for the next pass, which the phone predicts with no internet."
