hero_eyebrow:
  other: "Ανοιχτού κώδικα δρομολόγηση ανάμεσα σε ασυρμάτους που δεν φτάνουν ο ένας τον άλλον"
hero_title_a:
  other: "Ένα μήνυμα."
hero_title_b:
  other: "Κάθε δρόμος προς τα έξω."
hero_sub:
  other: "Ένα πλέγμα κρατάει ένα χωριό σε επικοινωνία με τον εαυτό του, αλλά δεν έχει δρόμο έξω από την κοιλάδα. Ένα δορυφορικό μόντεμ φτάνει παντού και κοστίζει πραγματικά χρήματα ανά μήνυμα. Το MeshSat είναι το στρώμα ανάμεσα: παίρνει ένα μήνυμα από το πλέγμα και το στέλνει από όποιον φορέα είναι ακόμη ζωντανός, ξοδεύοντας δορυφορικά bytes μόνο όταν δεν έχει μείνει τίποτα δωρεάν."
hero_status:
  other: "Πρωτότυπο πριν από την κυκλοφορία. Δεν έχει εγκατασταθεί ποτέ σε πραγματικό χρήστη, ούτε έχει χρησιμοποιηθεί ποτέ σε έκτακτη ανάγκη."
hero_star:
  other: "Δώστε αστέρι στο GitHub"
hero_visitors:
  other: "Επισκέπτες"
hero_donate:
  other: "Υποστήριξη στο Ko-fi"
trace_title:
  other: "Ίχνος δρομολόγησης, ένα μήνυμα κινδύνου"
trace_bridge:
  other: "bridge tesseract"
trace_alt:
  other: "Παράδειγμα ίχνους δρομολόγησης: ένα SOS φτάνει μέσω πλέγματος LoRa, το σκέλος Iridium αποτυγχάνει επειδή ο δορυφόρος είναι κάτω από τον ορίζοντα, και το μήνυμα παραδίδεται αντ' αυτού μέσω SMS, TAK και MQTT."
t1:
  other: "SOS από τον κόμβο !a4f2c1, 17 bytes"
t2:
  other: "3 κανόνες ταίριαξαν, επιλέχθηκαν 4 διαδρομές"
t3:
  other: "κάτω από τον ορίζοντα, επόμενη διέλευση σε 11m 38s"
t4:
  other: "smaz2 από 17 σε 11 bytes, SMS στην ομάδα επαφών"
t5:
  other: "θέση ως Cursor-on-Target, παράλληλα"
t6:
  other: "καταγράφηκε για τον πίνακα και τα webhooks"
trace_foot:
  other: "Το δορυφορικό σκέλος απέτυχε και το μήνυμα έφτασε ούτως ή άλλως. Αυτό είναι όλο το προϊόν. Οι διαδρομές, η σειρά εφεδρείας και οι αλυσίδες μετασχηματισμού ρυθμίζονται ανά διεπαφή."
tr_title:
  other: "Οκτώ φορείς, εννέα καλωδιωμένες διεπαφές"
tr_sub:
  other: "Το Iridium τρέχει σε δύο μόντεμ, το 9603N για SBD και το 9704 για IMT. Κάθε φορέας είναι πλήρης διεπαφή με δικό του MTU, μοντέλο κόστους και αλυσίδα μετασχηματισμού. Το TAK και τα webhooks είναι ενσωματώσεις, όχι φορείς. Η κατάσταση λέει τι έχουμε πράγματι τρέξει, όχι τι ελπίζουμε."
