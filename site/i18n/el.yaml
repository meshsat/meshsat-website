tr_note_a:
  other: "Η συνένωση πολλών φορέων πάνω από πληρωμένη δορυφορική ζεύξη δεν έχει ακόμη επικυρωθεί, και ο ανιχνευτής παρεμβολών έχει δει μόνο θόρυβο περιβάλλοντος."
tr_note_link:
  other: "Το αποθετήριο παραθέτει την πλήρη λίστα"
tr_note_b:
  other: "με το τι έχει και τι δεν έχει αποδειχθεί."
cost_title:
  other: "Πάρτε τον φθηνότερο δρόμο που ακόμη λειτουργεί."
cost_sub:
  other: "Μια γραμμή Iridium κοστίζει μερικές δεκάδες ευρώ τον μήνα συν μονάδες ανά μήνυμα, με χρέωση σε μπλοκ των 340 bytes. Δώστε από μία σε κάθε άτομο μιας ομάδας και ο λογαριασμός μεγαλώνει μαζί με την ομάδα. Αυτή η τιμή καθορίζει κάθε απόφαση δρομολόγησης."
c1_h:
  other: "Μία πληρωμένη ζεύξη, μοιρασμένη"
c1_p:
  other: "Μια ομάδα κουβαλά φθηνούς ασυρμάτους πλέγματος. Μία πύλη κρατά την ακριβή δορυφορική γραμμή. Όλοι φτάνουν προς τα έξω μέσα από αυτήν, οπότε το κόστος παύει να μεγαλώνει με τον αριθμό των ατόμων."
c2_h:
  other: "Πρώτα οι δωρεάν φορείς"
c2_p:
  other: "Κάθε διεπαφή δηλώνει κόστος. Ο δρομολογητής προτιμά τους δωρεάν, δηλαδή πλέγμα, packet radio, Bluetooth και WiFi, και καταφεύγει σε δορυφόρο ή SMS μόνο όταν δεν υπάρχει τίποτα δωρεάν διαθέσιμο."
c3_h:
  other: "Και τότε όσο λιγότερα bytes γίνεται"
c3_p:
  other: "Ό,τι φεύγει από χρεώσιμο φορέα συμπιέζεται πρώτα. Το SMAZ2 το κάνει σε λιγότερο από ένα χιλιοστό του δευτερολέπτου σε σύντομο κείμενο, κάτι που μετράει όταν η χρέωση γίνεται ανά μπλοκ και όχι ανά byte."
c4_h:
  other: "Στέλνεται όταν ο ουρανός το επιτρέπει"
c4_p:
  other: "Η πρόβλεψη διέλευσης από τροχιακά στοιχεία SGP4 κρατά την κίνηση μέχρι το παράθυρο ορατότητας, αντί να ξοδεύει μπαταρία σε προσπάθειες προς δορυφόρο που βρίσκεται κάτω από τον ορίζοντα."
funding_a:
  other: "Το MeshSat είναι ελεύθερο λογισμικό υπό την GPLv3. Η ανάπτυξη υποστηρίζεται από το"
funding_b:
  other: ", και ένα εξάμηνο πρόγραμμα πεδίου ξεκινά τον Νοέμβριο του 2026."
hw_title:
  other: "Πού τρέχει"
hw_sub:
  other: "Ξεκινήστε με έναν υπολογιστή Linux και έναν ασύρματο mesh USB. Προσθέστε δορυφορική σύνδεση, SMS ή αισθητήρες όταν χρειαστούν και ορίστε μια διαδρομή για κάθε σύνδεση."
th_part:
  other: "Εξάρτημα"
th_role:
  other: "Ρόλος"
hw1:
  other: "Κεντρική μονάδα. ARM64, ή οποιοδήποτε x86_64 Linux με Docker και σειριακή USB."
hw2:
  other: "Ασύρματο πλέγματος Meshtastic στα 868 ή 915 MHz."
hw3:
  other: "Δορυφόρος Iridium. SBD με 340 bytes, ή IMT με 100 KB."
hw4:
  other: "Κινητή 4G και 2G, για SMS και δεδομένα."
hw5:
  other: "Συντονιστής ZigBee."
hw6:
  other: "UPS και μπαταρία"
hw6r:
  other: "Επειδή οι ενδιαφέρουσες περιπτώσεις είναι ακριβώς εκείνες όπου έχει πέσει και το ρεύμα."
cap1:
  other: "Φάσμα ανά ζώνη, συνδέσεις και η υγεία κάθε φορέα, από την ίδια τη συσκευή"
cap2:
  other: "Πρόβλεψη διέλευσης, ώστε η ουρά να περιμένει δορυφόρο που είναι πράγματι ορατός"
cap3:
  other: "Έξι ώρες της ζώνης LoRa 868 MHz. Ο ανιχνευτής παρεμβολών έχει δει μόνο θόρυβο περιβάλλοντος."
cap4:
  other: "Ένας αισθητήρας ZigBee θερμοκρασίας και υγρασίας και οι τελευταίες 24 ώρες του"
hw_note:
  other: "Ο πίνακας ελέγχου είναι ενσωματωμένος στο εκτελέσιμο και σερβίρεται από τη συσκευή. Χωρίς νέφος, χωρίς λογαριασμό."
hw_repo_a:
  other: "Το υλικό έχει δικό του αποθετήριο, "
hw_repo_b:
  other: ": οδηγοί κατασκευής για τα δύο κιτ V1 και το μη κατασκευασμένο σχέδιο V2 για βαλίτσα Peli 1450. Το V2 βρίσκεται ακόμη σε τεχνικό έλεγχο και δεν είναι έτοιμο για παραγγελία."
nf_title:
  other: "Τι δεν είναι"
nf_sub:
  other: "Το Starlink είναι συνδεσιμότητα, το Meshtastic ένα τοπικό πλέγμα, το Reticulum ένα δίκτυο πάνω από οποιονδήποτε φορέα, το TAK ένας κοινός χάρτης της κατάστασης. Το MeshSat δεν αντικαθιστά κανένα τους. Μεταφέρει μηνύματα ανάμεσά τους."
nf1_h:
  other: "Δεν αντικαθιστά το Starlink"
nf1_p:
  other: "Το MeshSat μεταφέρει κείμενο, θέσεις και τηλεμετρία. Αν χρειάζεστε βιντεοκλήσεις ή τον ιστό, πάρτε Starlink. Αυτό είναι για τις περιπτώσεις που δεν καλύπτει ένα πιάτο: με μπαταρία, σε μέγεθος τσέπης, χωρίς ρεύμα δικτύου."
nf2_h:
  other: "Ούτε φωνή ούτε βίντεο"
nf2_p:
  other: "Οι δορυφορικές ζεύξεις και τα πλέγματα έχουν υψηλή καθυστέρηση και χαμηλή ταχύτητα. Πρόκειται για μηνύματα αποθήκευσης και προώθησης. Σκεφτείτε SMS, όχι τηλεφώνημα."
nf3_h:
  other: "Δεν είναι διακομιστής δικτύου LoRaWAN"
nf3_p:
  other: "Η πλευρά του πλέγματος μιλά Meshtastic, ένα δικό του πρωτόκολλο πάνω από LoRa. Για LoRaWAN τρέξτε ChirpStack και συνδέστε το μέσω MQTT."
nf4_h:
  other: "Δεν είναι υπηρεσία έκτακτης ανάγκης"
nf4_p:
  other: "Ερευνητικό πρωτότυπο, όχι αντικατάσταση του 112 ή οποιουδήποτε εθνικού αριθμού έκτακτης ανάγκης. Τίποτα εδώ δεν είναι πιστοποιημένο και τίποτα εδώ δεν έχει χρησιμοποιηθεί σε πραγματική έκτακτη ανάγκη."
hub_badge:
  other: "Ανοιχτό"
hub_status:
  other: "Το Hub είναι ανοιχτό. Δημιουργήστε λογαριασμό και τον ελέγχουμε πριν ενεργοποιηθεί."
