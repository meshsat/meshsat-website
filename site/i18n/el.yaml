cat_routing:
  other: "Δρομολόγηση"
st_field:
  other: "Δοκιμασμένο στο πεδίο"
st_sat:
  other: "Επιβεβαιωμένο μέσω δορυφόρου"
st_little:
  other: "Ελάχιστη χρήση στο πεδίο"
st_rns:
  other: "Συνεργάζεται με το Python RNS"
tx_cell:
  other: "SMS και δεδομένα (A7670E)"
tx_aprs:
  other: "APRS (ενσωματωμένο Direwolf, KISS)"
tx_rns:
  other: "Reticulum TCP (πλαίσια HDLC)"
tr_note_a:
  other: "Η συνένωση πολλών φορέων πάνω από πληρωμένη δορυφορική ζεύξη δεν έχει ακόμη επικυρωθεί, και ο ανιχνευτής παρεμβολών έχει δει μόνο θόρυβο περιβάλλοντος."
tr_note_link:
  other: "Το αποθετήριο παραθέτει την πλήρη λίστα"
tr_note_b:
  other: "με το τι έχει και τι δεν έχει αποδειχθεί."
cost_title:
  other: "Τα δορυφορικά bytes είναι ακριβά. Αυτός είναι όλος ο σχεδιασμός."
cost_sub:
  other: "Μια γραμμή Iridium κοστίζει μερικές δεκάδες ευρώ τον μήνα συν μονάδες ανά μήνυμα, με χρέωση σε μπλοκ των 340 bytes. Δώστε από μία σε κάθε άτομο μιας ομάδας και ο λογαριασμός μεγαλώνει μαζί με την ομάδα. Ακριβώς αυτή η τιμή είναι ο λόγος που υπάρχει το στρώμα δρομολόγησης."
c1_h:
  other: "Μία πληρωμένη ζεύξη, μοιρασμένη"
c1_p:
  other: "Μια ομάδα κουβαλά φθηνούς ασυρμάτους πλέγματος. Μία πύλη κρατά την ακριβή δορυφορική γραμμή. Όλοι φτάνουν προς τα έξω μέσα από αυτήν, οπότε το κόστος παύει να μεγαλώνει με τον αριθμό των ατόμων."
c2_h:
  other: "Πρώτα οι δωρεάν φορείς"
c2_p:
  other: "Κάθε διεπαφή δηλώνει κόστος. Ο δρομολογητής προτιμά τους δωρεάν, δηλαδή πλέγμα, packet radio, Bluetooth και WiFi, και καταφεύγει σε δορυφόρο ή SMS μόνο όταν δεν υπάρχει τίποτα δωρεάν διαθέσιμο."
c3_h:
  other: "Και τότε όσο λιγότερα bytes γίνεται"
c3_p:
  other: "Ό,τι φεύγει από χρεώσιμο φορέα συμπιέζεται πρώτα. Το SMAZ2 το κάνει σε λιγότερο από ένα χιλιοστό του δευτερολέπτου σε σύντομο κείμενο, κάτι που μετράει όταν η χρέωση γίνεται ανά μπλοκ και όχι ανά byte."
c4_h:
  other: "Στέλνεται όταν ο ουρανός το επιτρέπει"
c4_p:
  other: "Η πρόβλεψη διέλευσης από τροχιακά στοιχεία SGP4 κρατά την κίνηση μέχρι το παράθυρο ορατότητας, αντί να ξοδεύει μπαταρία σε προσπάθειες προς δορυφόρο που βρίσκεται κάτω από τον ορίζοντα."
funding_a:
  other: "Το MeshSat είναι ελεύθερο λογισμικό υπό την GPLv3. Η ανάπτυξη υποστηρίζεται από το"
funding_b:
  other: ", και ένα εξάμηνο πρόγραμμα πεδίου ξεκινά τον Νοέμβριο του 2026."
hw_title:
  other: "Πού τρέχει"
hw_sub:
  other: "Ένα Raspberry Pi σε αδιάβροχη βαλίτσα, με ασυρμάτους σε USB και GPIO. Οι συσκευές αναγνωρίζονται στην εκκίνηση από το USB αναγνωριστικό τους και έναν έλεγχο πρωτοκόλλου, οπότε το να τις συνδέσεις είναι όλη η παραμετροποίηση."
th_part:
  other: "Εξάρτημα"
th_role:
  other: "Ρόλος"
hw1:
  other: "Κεντρική μονάδα. ARM64, ή οποιοδήποτε x86_64 Linux με Docker και σειριακή USB."
hw2:
  other: "Ασύρματο πλέγματος Meshtastic στα 868 ή 915 MHz."
hw3:
  other: "Δορυφόρος Iridium. SBD με 340 bytes, ή IMT με 100 KB."
hw4:
  other: "Κινητή 4G και 2G, για SMS και δεδομένα."
hw5:
  other: "Συντονιστής ZigBee."
hw6:
  other: "UPS και μπαταρία"
hw6r:
  other: "Επειδή οι ενδιαφέρουσες περιπτώσεις είναι ακριβώς εκείνες όπου έχει πέσει και το ρεύμα."
cap1:
  other: "Σήμα, κίνηση και υγεία καναλιών, από την ίδια τη συσκευή"
cap2:
  other: "Πρόβλεψη διέλευσης, ώστε η ουρά να περιμένει δορυφόρο που είναι πράγματι ορατός"
cap3:
  other: "Ζωντανή τοπολογία πλέγματος"
cap4:
  other: "Κανόνες προώθησης και κατάσταση ανά πύλη"
hw_note:
  other: "Ο πίνακας ελέγχου είναι ενσωματωμένος στο εκτελέσιμο και σερβίρεται από τη συσκευή. Χωρίς νέφος, χωρίς λογαριασμό."
hw_repo_a:
  other: "Το υλικό έχει δικό του αποθετήριο, "
hw_repo_b:
  other: ": τα δύο κιτ που έχουν κατασκευαστεί μέχρι τώρα με τον οδηγό συναρμολόγησής τους, και οι πλακέτες φορείς V2 για βαλίτσα Peli 1520, σχεδιασμένες και έτοιμες για κατασκευή αλλά όχι ακόμη κατασκευασμένες."
nf_title:
  other: "Τι δεν είναι"
nf_sub:
  other: "Ο γρηγορότερος τρόπος να χαθεί ένα απόγευμα είναι να περιμένει κανείς το λάθος πράγμα από αυτό."
nf1_h:
  other: "Δεν αντικαθιστά το Starlink"
nf1_p:
  other: "Το MeshSat μεταφέρει κείμενο, θέσεις και τηλεμετρία. Αν χρειάζεστε βιντεοκλήσεις ή τον ιστό, πάρτε Starlink. Αυτό είναι για τις περιπτώσεις που δεν καλύπτει ένα πιάτο: με μπαταρία, σε μέγεθος τσέπης, χωρίς ρεύμα δικτύου."
nf2_h:
  other: "Ούτε φωνή ούτε βίντεο"
nf2_p:
  other: "Οι δορυφορικές ζεύξεις και τα πλέγματα έχουν υψηλή καθυστέρηση και χαμηλή ταχύτητα. Πρόκειται για μηνύματα αποθήκευσης και προώθησης. Σκεφτείτε SMS, όχι τηλεφώνημα."
nf3_h:
  other: "Δεν είναι διακομιστής δικτύου LoRaWAN"
nf3_p:
  other: "Η πλευρά του πλέγματος μιλά Meshtastic, ένα δικό του πρωτόκολλο πάνω από LoRa. Για LoRaWAN τρέξτε ChirpStack και συνδέστε το μέσω MQTT."
nf4_h:
  other: "Δεν είναι υπηρεσία έκτακτης ανάγκης"
nf4_p:
  other: "Ερευνητικό πρωτότυπο, όχι αντικατάσταση του 112 ή οποιουδήποτε εθνικού αριθμού έκτακτης ανάγκης. Τίποτα εδώ δεν είναι πιστοποιημένο και τίποτα εδώ δεν έχει χρησιμοποιηθεί σε πραγματική έκτακτη ανάγκη."
sys_title:
  other: "Το υπόλοιπο σύστημα"
sys_sub:
  other: "Το Bridge είναι μία συσκευή και λειτουργεί εντελώς μόνο του. Υπάρχουν δύο ακόμη κομμάτια για όταν μία συσκευή δεν είναι όλη η εικόνα."
hub_badge:
  other: "Κλειστή beta"
hub_status:
  other: "Το MeshSat Hub δεν έχει κυκλοφορήσει ακόμη. Τρέχει ως κλειστή beta στη δική μας υποδομή. Η πρόσβαση για επιδείξεις και δοκιμές κανονίζεται κατόπιν αιτήματος."
hub_p:
  other: "Διαχείριση στόλου πολλών bridges: λογαριασμοί OAuth2 και OIDC, κλειδιά API με ρόλους, απομόνωση ενοίκων, αλυσίδες κλιμάκωσης SOS, όρια ρυθμού ανά συσκευή και αρχείο ελέγχου Ed25519 σε αλυσίδα κατακερματισμού. Αναπτύσσεται αυτόνομα, σε συστάδα ή σε Kubernetes."
hub_cta:
  other: "Αίτημα πρόσβασης beta"
and_p:
  other: "Ένα τηλέφωνο ως αυτόνομη πύλη, χωρίς Pi και χωρίς καλώδια. Μιλά σε ασύρματο Meshtastic μέσω Bluetooth LE, σε μόντεμ Iridium μέσω Bluetooth SPP, και χρησιμοποιεί τα SMS του ίδιου του τηλεφώνου, όλα ταυτόχρονα. Ίδια κρυπτογράφηση και ίδιες μορφές μηνυμάτων με το Bridge."
and_cta:
  other: "Πηγαίος κώδικας Android"
cta_title:
  other: "Δοκιμάστε το"
cta_sub:
  other: "Μία εντολή σε μηχάνημα Linux με έναν ασύρματο συνδεδεμένο. Μία συσκευή αρκεί για αρχή, και ό,τι λείπει καταγράφεται ως προειδοποίηση, όχι ως σφάλμα."
cta_source:
  other: "Δείτε τον κώδικα"
cta_docs:
  other: "Τεκμηρίωση"
cta_matrix:
  other: "Ρωτήστε στο Matrix"
cta_note:
  other: "Οι αναφορές σφαλμάτων από ανθρώπους που τρέχουν εξοπλισμό τον οποίο δεν έχουμε δοκιμάσει είναι το πιο χρήσιμο πράγμα που μπορείτε να στείλετε. Η λίστα υποστηριζόμενων συσκευών είναι μικρή επειδή αναφέρει μόνο όσα έχουμε τρέξει στην πράξη."
