ig_cases_eyebrow:
  other: "05 / ΧΡΗΣΕΙΣ ΠΡΟΣ ΑΞΙΟΛΟΓΗΣΗ"

ig_cases_title:
  other: "Σενάρια ενσωμάτωσης"

ig_cases_intro:
  other: "Πρόκειται για ερευνητικά σενάρια. Δεν προβάλλεται ισχυρισμός για εγκατάσταση σε πελάτη, συμβατότητα με στόλο ασυρμάτων ή επιχειρησιακή έγκριση."

ig_case_tl_title:
  other: "Ομάδες TETRA και εθελοντικό δίκτυο mesh"

ig_case_tl_body:
  other: "Αξιολόγηση ανταλλαγής επιλεγμένων κειμένων και θέσεων μεταξύ επαγγελματικής ομάδας ασυρμάτου και εθελοντών με Meshtastic, με Iridium για απομακρυσμένες αναφορές. Η πολιτική δρομολόγησης ελέγχει τι περνά μεταξύ των δικτύων."

ig_case_td_title:
  other: "Ομάδες με διαφορετικά συστήματα ασυρμάτου"

ig_case_td_body:
  other: "Αξιολόγηση ανταλλαγής μηνυμάτων μεταξύ ομάδων TETRA και DMR σε απευθείας λειτουργία. Πρέπει πρώτα να καθοριστούν οι μορφές δεδομένων κάθε στόλου, οι άδειες καναλιών και ο χειρισμός της κρυπτογράφησης."

ig_case_dl_title:
  other: "Ομάδες DMR και τοπικοί αισθητήρες"

ig_case_dl_body:
  other: "Αξιολόγηση κειμένων DMR και υποστηριζόμενων δεδομένων θέσης μαζί με αναφορές πεδίου Meshtastic. Δοκιμή των τύπων μηνυμάτων που μπορούν να μετατραπούν και να προωθηθούν μέσω της κοινής δορυφορικής διαδρομής."

ig_contact_eyebrow:
  other: "ΤΕΧΝΙΚΗ ΣΥΖΗΤΗΣΗ"

ig_contact_title:
  other: "Ας συζητήσουμε τον ασύρματο και τη χρήση σας."

ig_contact_intro:
  other: "Πείτε μας ποια μοντέλα ασυρμάτων, διαμόρφωση απευθείας λειτουργίας, τύπους μηνυμάτων, χώρα εγκατάστασης και σημείο ενσωμάτωσης θέλετε να αξιολογήσετε."

ig_contact_note:
  other: "Σχεδιαστικές ιδέες έρευνας και ανάπτυξης. Μονάδες υπό αξιολόγηση."

ig_details:
  other: "Προδιαγραφές εξαρτήματος"

ig_radio_key:
  other: "Γράμματα τοπικών ασυρμάτων"

ig_render_caption:
  other: "Απεικόνιση σχεδιαστικής ιδέας έρευνας και ανάπτυξης από τη MeshSat. Το περίβλημα, το υλικό και η ενσωμάτωση RF δεν έχουν επαληθευτεί."

ig_render_alt:
  other: "Σχεδιαστική ιδέα περιβλήματος MSC-3T με μικρή έγχρωμη οθόνη ηλεκτρονικού χαρτιού, συμπαγή κεραία Iridium και κεραία μαστιγίου TETRA"

ig_exploded_alt:
  other: "Αναπτυγμένη όψη της σχεδιαστικής ιδέας MSC-3T με οθόνη, πλακέτα υπολογιστή, δορυφορικό modem, μονάδα ασυρμάτου και μπαταρία. Η μηχανική εφαρμογή δεν έχει επαληθευτεί"

ig_radio_t_data:
  other: "Κείμενο SDS, αναφορές κατάστασης και θέσης"

ig_radio_t_limit:
  other: "Αδειοδοτημένα κανάλια TETRA. Η διαλειτουργικότητα SDS, κατάστασης και θέσης σε απευθείας λειτουργία χρειάζεται επικύρωση με τους ασυρμάτους της ομάδας. Η απευθείας λειτουργία του BDM 31 3L δεν έχει επιβεβαιωθεί."

ig_radio_d_data:
  other: "Κείμενο. Η κατάσταση και οι θέσεις εξαρτώνται από τη μονάδα και τον στόλο ασυρμάτων"

ig_radio_d_limit:
  other: "Αδειοδοτημένα κανάλια DMR. Οι μορφές κειμένου, τα πρωτόκολλα θέσης και η κρυπτογράφηση διαφέρουν ανά στόλο. Η δημόσια λίστα εντολών της NiceRF δεν τεκμηριώνει εντολή θέσης. Η διαλειτουργικότητα δεδομένων και κρυπτογράφησης μεταξύ κατασκευαστών δεν έχει επαληθευτεί."

ig_radio_l_data:
  other: "Πακέτα κειμένου και θέσης Meshtastic"

ig_radio_l_modules:
  other: "Ασύρματος με βάση το Semtech SX1262"

ig_radio_l_limit:
  other: "Ισχύουν τα περιφερειακά όρια ζώνης, ισχύος εκπομπής και κύκλου λειτουργίας. Απαιτείται υπολογιστής Meshtastic και συμβατό υλικολογισμικό. Το SX1262 από μόνο του δεν εκτελεί Meshtastic."

ig_radio_a_data:
  other: "Ραδιοερασιτεχνικό κείμενο, κατάσταση και θέσεις"

ig_radio_a_limit:
  other: "Μόνο για ραδιοερασιτεχνική χρήση. Απαιτείται αδειοδοτημένος χειριστής. Χωρίς κρυπτογράφηση. Δεν προορίζεται για επικοινωνίες δημόσιων υπηρεσιών. Οι διαδρομές προς APRS πρέπει να επιβάλλουν αυτό το όριο."

ig_radio_h_data:
  other: "Επιλεγμένα μηνύματα εφαρμογών μέσω τοπικής σύνδεσης IP"

ig_radio_h_limit:
  other: "Ισχύουν τα περιφερειακά όρια ζώνης και ισχύος. Απαιτούνται συμβατές συσκευές HaLow. Η δορυφορική διαδρομή μεταφέρει επιλεγμένα μηνύματα, όχι ευρυζωνική σύνδεση IP. Η επιλογή πλακέτας και η ενσωμάτωση στον υπολογιστή βρίσκονται υπό αξιολόγηση."

ig_radio_g_name:
  other: "Κυψέλη 2G"

ig_radio_g_data:
  other: "SMS από τηλέφωνα εγγεγραμμένα σε τοπική κυψέλη GSM"

ig_radio_g_modules:
  other: "PlutoSDR με Osmocom"

ig_radio_g_limit:
  other: "Αδειοδότηση ανά τοποθεσία. Κάθε εγκατάσταση χρειάζεται δική της άδεια ραδιοεκπομπής. Η διαμόρφωση SIM, το φάσμα, ο χρονισμός, το φιλτράρισμα RF και η υπολογιστική ισχύς χρειάζονται επικύρωση. Πρόκειται για τοπική κυψέλη, όχι για περιαγωγή σε δημόσιο δίκτυο."

ig_tw1m_note:
  other: "Εμφανίζονται οι διαστάσεις του δημόσιου φυλλαδίου. Ο χειρισμός θέσης και η διαλειτουργικότητα με τον στόλο απαιτούν επικύρωση σε πάγκο δοκιμών."

ig_tw1m_sourceLabel:
  other: "Δημόσιο φύλλο προδιαγραφών Airbus, 03/2018 (αντίγραφο Senop)"

ig_tw1m_fact_2_1:
  other: "RS-232 ή USB, εντολές AT"

ig_tw1m_fact_3_1:
  other: "SDS και κατάσταση σε DMO, GPS"

ig_bdm31_note:
  other: "Το δημόσιο φύλλο προδιαγραφών αναφέρει μόνο TMO. Η υποστήριξη DMO, που απαιτείται για τη σχεδιαστική ιδέα ασυρμάτων ομάδας, δεν έχει επιβεβαιωθεί."

ig_bdm31_sourceLabel:
  other: "Δημόσιο φύλλο προδιαγραφών PMR-R & D, V1.1"

ig_bdm31_fact_1_1:
  other: "1.8 W, κλάση 3L"

ig_bdm31_fact_2_1:
  other: "3.7 V, 3.0 A κατά τη ριπή εκπομπής"

ig_bdm31_fact_3_1:
  other: "PEI (ETSI EN 300 392-5), σειριακή / RS-232"

ig_mt100_note:
  other: "Το φύλλο προδιαγραφών αναφέρει DMRA AES-128/256 και ARC4. Αυτό δεν τεκμηριώνει διαλειτουργικότητα με την υλοποίηση κειμένου, θέσης ή κρυπτογράφησης ενός στόλου ασυρμάτων."

ig_mt100_sourceLabel:
  other: "Δημόσιο φύλλο προδιαγραφών Leonardo, mm08909, 09/2020"

ig_mt100_fact_2_1:
  other: "7.4 V, έως 2 A"

ig_mt100_fact_3_1:
  other: "UART 3.3 V, εντολές AT, IP μέσω DMR"

ig_dmr818_note:
  other: "Τεκμηριώνονται εντολές κειμένου, αλλά όχι εντολή θέσης. Η συμβατότητα κρυπτογράφησης και κειμένου με άλλους ασυρμάτους παραμένει ανεπαλήθευτη."

ig_dmr818_sourceLabel:
  other: "Δημόσιο φύλλο προδιαγραφών NiceRF, V1.8, 06/2026"

ig_dmr818_fact_0_1:
  other: "134-174, 320-400 ή 400-470 MHz"

ig_dmr818_fact_1_1:
  other: "2 W, το φύλλο προδιαγραφών ορίζει 1 W για CE/FCC"

ig_dmr818_fact_3_1:
  other: "UART 57.600 baud, δυαδικές εντολές"

ig_sx1262_note:
  other: "Μια μονάδα ασυρμάτου, μια κεραία και ένας υπολογιστής Meshtastic βρίσκονται υπό αξιολόγηση. Τα όρια του ολοκληρωμένου δεν αποτελούν άδεια εκπομπής με αυτές τις ρυθμίσεις."

ig_sx1262_sourceLabel:
  other: "Δημόσιες προδιαγραφές προϊόντος Semtech SX126x"

ig_sx1262_fact_0_1:
  other: "150-960 MHz (δυνατότητα ολοκληρωμένου)"

ig_sx1262_fact_1_1:
  other: "Έως +22 dBm (δυνατότητα ολοκληρωμένου)"

ig_sx1262_fact_2_1:
  other: "LoRa και (G)FSK"

ig_picoaprs_note:
  other: "Μοντέλο VHF. Μόνο ραδιοερασιτεχνική χρήση, αδειοδοτημένος χειριστής, χωρίς κρυπτογράφηση. Η δική του μπαταρία είναι ξεχωριστή από τη σχεδιαστική ιδέα μπαταρίας του MSC-3."

ig_picoaprs_sourceLabel:
  other: "Δημόσιο εγχειρίδιο V4 του κατασκευαστή, τεχνικές προδιαγραφές, 20/11/2023"

ig_picoaprs_fact_0_1:
  other: "Περίπου 35 × 67 × 25 mm / 60 g"

ig_picoaprs_fact_2_1:
  other: "Μέγιστο 1 W"

ig_picoaprs_fact_3_1:
  other: "AX.25 στα 1.200 baud, USB KISS TNC"

ig_mm6108_note:
  other: "Μια μονάδα Morse Micro και μια πλακέτα φορέα παραμένουν υπό αξιολόγηση. Η πλακέτα LILYGO T-HaLow παρακάτω χρησιμοποιεί TX-AH και αποτελεί ξεχωριστή υποψήφια επιλογή."

ig_mm6108_sourceLabel:
  other: "Δημόσια παρουσίαση προϊόντος Morse Micro MM6108"

ig_mm6108_fact_1_1:
  other: "SDIO ή SPI"

ig_mm6108_fact_2_1:
  other: "Τοπική πρόσβαση IP για μεταφορά μηνυμάτων"

ig_thalow_note:
  other: "Η έκδοση πλακέτας, η περιφερειακή παραλλαγή RF και η διεπαφή υπολογιστή χρειάζονται επιβεβαίωση. Δεν αποδίδεται chipset Morse Micro σε αυτή την πλακέτα."

ig_thalow_sourceLabel:
  other: "Δημόσια τεκμηρίωση υλικού και προδιαγραφές μονάδων LILYGO"

ig_thalow_fact_1_1:
  other: "Taixin TX-AH, σύμφωνα με την τεκμηρίωση LILYGO"

ig_thalow_fact_2_1:
  other: "Ethernet και έλεγχος με εντολές AT"

ig_pluto_name:
  other: "PlutoSDR με Osmocom"

ig_pluto_family:
  other: "G / κυψέλη 2G"

ig_pluto_note:
  other: "Προδιαγραφές Analog Devices ADALM-PLUTO. Η λειτουργία GSM με Osmocom, το φιλτράρισμα RF και η επεξεργασία στην πλατφόρμα απαιτούν επικύρωση. Αδειοδότηση ανά τοποθεσία."

ig_pluto_sourceLabel:
  other: "Δημόσιες τεχνικές προδιαγραφές Analog Devices ADALM-PLUTO"

ig_pluto_fact_0_1:
  other: "325 MHz έως 3.8 GHz (δυνατότητα SDR)"

ig_pluto_fact_1_1:
  other: "Έως 20 MHz (δυνατότητα SDR)"

ig_pluto_fact_2_1:
  other: "Ένας πομπός, ένας δέκτης"

ig_rockblock_family:
  other: "Iridium / όλες οι παραλλαγές"

ig_rockblock_note:
  other: "Πάντα ενσωματωμένο στη σχεδιαστική ιδέα MSC-3. Η ενσωμάτωση της μονάδας βρίσκεται υπό αξιολόγηση. Απαιτεί εγκεκριμένη κεραία και δορυφορική υπηρεσία. Το όριο ωφέλιμου φορτίου είναι προδιαγραφή του modem, όχι επικυρωμένο μέγεθος μηνύματος MSC-3."

