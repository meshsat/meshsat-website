ig_mail_body:
  other: "Τοπικοί ασύρματοι: {radios}\nΠάντα ενσωματωμένο: Iridium / RockBLOCK 9704 (μονάδα υπό αξιολόγηση)\n\nΜοντέλα ασυρμάτων και τύποι μηνυμάτων:\nΧώρα και τοποθεσία εγκατάστασης:\nΣημείο ενσωμάτωσης:\n"

