ig_scope:
  other: "Έρευνα και ανάπτυξη, όχι επικυρωμένες προδιαγραφές συσκευής. Καμία παραλλαγή MSC-3 δεν έχει χρησιμοποιηθεί ποτέ από πραγματικό χρήστη. Δεν είναι υπηρεσία έκτακτης ανάγκης και δεν αντικαθιστά το 112."

ig_arch_alt:
  other: "Ενδεικτική αρχιτεκτονική. Οι ασύρματοι της ομάδας συνδέονται μέσω μίας ή δύο τοπικών μονάδων ασυρμάτου με το MeshSat Bridge σε Raspberry Pi Zero 2 W. Το Bridge δρομολογεί μηνύματα μεταξύ των τοπικών ασυρμάτων και ενός RockBLOCK 9704 με Iridium IMT. Τα δορυφορικά μηνύματα φτάνουν στο σύστημα του System Integrator. Μια μπαταρία τροφοδοτεί την πύλη. Όλες οι διαδρομές απαιτούν επικύρωση."

