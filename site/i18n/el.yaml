ig_study_eyebrow:
  other: "MSC-3T / ΜΕΛΕΤΗ ΠΕΡΙΒΛΗΜΑΤΟΣ"

ig_study_title:
  other: "Οθόνη, χειριστήρια και κράτημα"

ig_study_intro:
  other: "Μια μικρή έγχρωμη οθόνη ηλεκτρονικού χαρτιού, συμβατή με το Raspberry Pi, βρίσκεται υπό αξιολόγηση. Οι όψεις εξετάζουν το περίβλημα και τα χειριστήρια. Η εργονομία και η τοποθέτηση των κεραιών απαιτούν ακόμη δοκιμές."

ig_detail_alt:
  other: "Κοντινή όψη της σχεδιαστικής ιδέας MSC-3T με οθόνη ηλεκτρονικού χαρτιού, δύο εμπρόσθια πλήκτρα και στεγανοποιητικό περιβλήματος"

ig_detail_caption:
  other: "Μελέτη οθόνης και χειριστηρίων. Η οθόνη απεικονίζει ενδεικτικές πληροφορίες κατάστασης."

ig_hand_alt:
  other: "Σχεδιαστική ιδέα περιβλήματος MSC-3T σε χέρι με γάντι, με δύο ορατές κεραίες"

ig_hand_caption:
  other: "Μελέτη κρατήματος με χέρι που φορά γάντι. Το μέγεθος και η λαβή δεν έχουν επικυρωθεί."

ig_field_alt:
  other: "Σχεδιαστική ιδέα MSC-3T δίπλα σε ασύρματο χειρός χωρίς διακριτικά, πάνω σε θήκη μεταφοράς σε τρισδιάστατη υπαίθρια σκηνή"

ig_field_caption:
  other: "Ενδεικτική διάταξη ομάδας σε απευθείας λειτουργία. Προσομοιωμένη σκηνή, όχι δοκιμή πεδίου."

ig_exploded_caption:
  other: "Μελέτη συναρμολόγησης σε αναπτυγμένη όψη: περίβλημα, οθόνη, πλακέτα υπολογιστή, modem Iridium, μία τοπική μονάδα ασυρμάτου και χώρος μπαταρίας. Η διάταξη των εξαρτημάτων είναι ενδεικτική."

