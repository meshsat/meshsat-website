  other: "Έχει ξανασυμβεί"
is_joins_h:
  other: "Πώς μοιάζει η σύνδεσή τους"
is_to:
  other: "προς"
join1_h:
  other: "Δύο ομάδες σε δύο πλέγματα, χωρίς διαδίκτυο"
join1_s:
  other: "Δοκιμάστηκε από κιτ σε κιτ στις 12 Σεπτεμβρίου 2026 μέσω APRS και έπειτα μέσω SMS. Δείτε το βίντεο των κιτ πεδίου παραπάνω."
join2_h:
  other: "Μια κοιλάδα χωρίς σήμα, ένα γραφείο μακριά"
join2_s:
  other: "Το δορυφορικό σκέλος είναι επιβεβαιωμένο σε πραγματική ζεύξη Iridium, Μάρτιος 2026."
join3_h:
  other: "Ένα ασύρματο δίκτυο εθελοντών και ένα κέντρο επιχειρήσεων"
join3_s:
  other: "Και οι δύο διεπαφές είναι δοκιμασμένες στο πεδίο. Αυτή η διαδρομή δεν έχει τρέξει ακόμη από άκρη σε άκρη."
is_who:
  other: "Φτιαγμένο για τους ανθρώπους που δουλεύουν ανάμεσα σε αυτά τα νησιά: ομάδες έρευνας και διάσωσης, πολιτική προστασία και διαχείριση κρίσεων, ανθρωπιστικές οργανώσεις, δίκτυα έκτακτης ανάγκης ραδιοερασιτεχνών, αποστολές, πληρώματα πλοίων και απομακρυσμένη βιομηχανία. Κανείς τους δεν το χρησιμοποιεί ακόμη. Το πρόγραμμα πεδίου που ξεκινά τον Νοέμβριο του 2026 είναι η πρώτη πραγματική δοκιμή."
inc1_h:
  other: "Τυφώνας Κατρίνα, ακτές του Κόλπου των ΗΠΑ."
inc1_p:
  other: "Σε πολλές περιπτώσεις διασώστες από διαφορετικές υπηρεσίες δεν μπορούσαν να μιλήσουν μεταξύ τους λόγω ασύμβατων εκχωρήσεων συχνοτήτων. Ένα στρατιωτικό ελικόπτερο χρειάστηκε να ρίξει ένα μήνυμα σε μπουκάλι για να τους προειδοποιήσει για διαρροή αερίου."
inc1_src:
  other: "έκθεση της επιτροπής της FCC"
inc2_h:
  other: "Πλημμύρες στην κοιλάδα του Αρ και στο Άιφελ, Γερμανία."
inc2_p:
  other: "Επηρεάστηκαν 34 σταθμοί βάσης του ασύρματου δικτύου των υπηρεσιών έκτακτης ανάγκης. Σε εφεδρική λειτουργία ο ασύρματος δούλευε μόνο μέσα στην κυψέλη κάθε σταθμού, και οι συνδέσεις πέρα από αυτήν αποκαταστάθηκαν κατά περίπτωση, για παράδειγμα με πύλες."
inc2_src:
  other: "Landtag Rheinland-Pfalz, Drucksache 18/1947"
inc3_h:
  other: "Πυρκαγιά στη Λαχάινα, Μάουι."
inc3_p:
  other: "Το ασύρματο σύστημα δημόσιας ασφάλειας της κομητείας φαίνεται ότι λειτουργούσε συνεχώς, όμως η αστυνομία δεν άκουγε τα κανάλια της πυροσβεστικής ούτε η πυροσβεστική της αστυνομίας, και η αναξιόπιστη κινητή τηλεφωνία άφησε ασυντόνιστα τα ιδιωτικά υδροφόρα."
inc3_src:
  other: "έκθεση του FSRI για τον Γενικό Εισαγγελέα της Χαβάης"
inc4_h:
  other: "Μπλακ άουτ σε Ισπανία και Πορτογαλία."
inc4_p:
  other: "Τα δημόσια σταθερά και κινητά δίκτυα έπεσαν, και ο διαχειριστής διανομής της Πορτογαλίας κατέφυγε σε δορυφορικά τηλέφωνα. Ο διαχειριστής του ισπανικού δικτύου μπορούσε ακόμη να τηλεφωνεί αλλά δεν έφτανε το κέντρο ελέγχου διανομής στη Σεβίλλη, και η αποκατάσταση της τροφοδοσίας στην Ανδαλουσία διακόπηκε."
inc4_src:
  other: "έκθεση της ομάδας εμπειρογνωμόνων του ENTSO-E"
shot_open:
  other: "Άνοιγμα σε πλήρες μέγεθος"
shot_prev:
  other: "Προηγούμενο στιγμιότυπο"
shot_next:
  other: "Επόμενο στιγμιότυπο"
fab_bus:
  other: "κανόνες, αλυσίδες μετασχηματισμού, σειρά εφεδρείας, κόστος"
fab_cap:
  other: "Φορείς πάνω, ενσωματώσεις κάτω, ένας δρομολογητής ανάμεσα: ένας κανόνας μπορεί να δρομολογεί από οποιονδήποτε προσαρμογέα σε οποιονδήποτε άλλον. Με διακεκομμένη γραμμή: δεν υπάρχει ακόμη κώδικας στο Bridge· η ετικέτα δείχνει πού βρίσκεται ο εξοπλισμός."
host_lead:
  other: "Το κέντρο ελέγχου για κάθε κιτ, τηλέφωνο και κόμβο τσέπης που χρησιμοποιείτε: ένας χάρτης, κάθε μήνυμα, οι διαδρομές ανάμεσα στα δίκτυα, και ποιος ειδοποιείται όταν κάποιος πατήσει SOS. Τα κιτ δεν το χρειάζονται ποτέ για να περάσει ένα μήνυμα. Ο κώδικας είναι ο ίδιος και στις δύο περιπτώσεις. Αλλάζει μόνο ποιος τον τρέχει και πόσες συσκευές μπορείτε να καταχωρίσετε."
host_k_devices:
  other: "Συσκευές και bridges"
host_k_account:
  other: "Λογαριασμός σε εμάς"
host_v_account:
  other: "κανένας"
host_k_runs:
  other: "Τρέχει ως"
host_v_runs:
  other: "ένας διακομιστής ή Kubernetes"
host_th_plan:
  other: "Πλάνο"

