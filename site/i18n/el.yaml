plan_more_price:
  other: "μιλήστε μαζί μας"
plans_airtime:
  other: "Ο χρόνος εκπομπής παραμένει δικός σας. Συνδέστε τους δικούς σας λογαριασμούς Cloudloop, Twilio και Rock7. Δεν μεταπωλούμε δορυφορικό χρόνο ή SMS."
plans_keeps:
  other: "Μια καταχωρισμένη συσκευή συνεχίζει να λειτουργεί σε κάθε πλάνο. Ένα μικρότερο πλάνο εμποδίζει μόνο νέες καταχωρίσεις και ποτέ ένα SOS."
and_p:
  other: "Ένα συνηθισμένο τηλέφωνο Android γίνεται η πύλη, χωρίς Pi. Σε συνδυασμό με έναν κόμβο MeshSat τσέπης, μία σύνδεση Bluetooth φτάνει και στον ασύρματο mesh και στο μόντεμ Iridium, και η πλήρης έκδοση APK προσθέτει SMS μέσω της κάρτας SIM του τηλεφώνου. Τα δορυφορικά μηνύματα περιμένουν σε ουρά το επόμενο πέρασμα, το οποίο το τηλέφωνο προβλέπει χωρίς internet."
and_cta:
  other: "Πηγαίος κώδικας Android"
cta_title:
  other: "Δοκιμάστε το"
cta_sub:
  other: "Μία εντολή σε μηχάνημα Linux με έναν ασύρματο συνδεδεμένο. Μία συσκευή αρκεί για αρχή, και ό,τι λείπει καταγράφεται ως προειδοποίηση, όχι ως σφάλμα."
cta_source:
  other: "Δείτε τον κώδικα"
cta_docs:
  other: "Τεκμηρίωση"
cta_matrix:
  other: "Ρωτήστε στο Matrix"
cta_note:
  other: "Οι αναφορές σφαλμάτων από ανθρώπους που τρέχουν εξοπλισμό τον οποίο δεν έχουμε δοκιμάσει είναι το πιο χρήσιμο πράγμα που μπορείτε να στείλετε. Η λίστα υποστηριζόμενων συσκευών είναι μικρή επειδή αναφέρει μόνο όσα έχουμε τρέξει στην πράξη."
