and_play_note:
  other: "Στο Google Play η εφαρμογή διατίθεται χωρίς SMS, επειδή η πολιτική της Google δεν το επιτρέπει εκεί. Το APK είναι η πλήρης εφαρμογή. Η μία δεν μπορεί να ενημερώσει την άλλη."
films_title:
  other: "Δείτε το να λειτουργεί"
films_sub:
  other: "Πρώτα η εισαγωγή, μετά δύο field kits στον πάγκο που περνούν ένα μήνυμα από το ένα πλέγμα στο άλλο, μέσω ασυρμάτου APRS και έπειτα μέσω SMS."
films_consent:
