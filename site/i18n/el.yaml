hero_eyebrow:
  other: "Όταν τα δίκτυα πέφτουν, ό,τι επιζεί γίνεται νησιά. Το MeshSat τα συνδέει."
hero_title_a:
  other: "Ένα μήνυμα."
hero_title_b:
  other: "Κάθε δρόμος προς τα έξω."
hero_sub:
  other: "Ένα πλέγμα που κρατά μια κοιλάδα σε επικοινωνία, ένα ασύρματο δίκτυο εθελοντών, ένα δορυφορικό μόντεμ, ο χάρτης ενός κέντρου επιχειρήσεων: το καθένα μπορεί ακόμη να λειτουργεί, και κανένα δεν φτάνει τα άλλα. Το MeshSat είναι λογισμικό ανοιχτού κώδικα που παίρνει ένα μήνυμα από το ένα και το παραδίδει σε άλλο από όποιον φορέα είναι ακόμη ζωντανός, ξοδεύοντας δορυφορικά bytes μόνο όταν δεν έχει μείνει τίποτα δωρεάν."
hero_status:
  other: "Το Hub άνοιξε. Κανένας στόλος ακόμη, ποτέ σε πραγματική έκτακτη ανάγκη."
hero_star:
  other: "Δώστε αστέρι στο GitHub"
hero_visitors:
  other: "Επισκέπτες"
hero_donate:
  other: "Υποστήριξε το MeshSat"
trace_title:
  other: "Ίχνος δρομολόγησης, ένα μήνυμα κινδύνου"
trace_bridge:
  other: "bridge tesseract"
trace_alt:
  other: "Παράδειγμα ίχνους δρομολόγησης: ένα SOS φτάνει μέσω πλέγματος LoRa, το σκέλος Iridium αποτυγχάνει επειδή ο δορυφόρος είναι κάτω από τον ορίζοντα, και το μήνυμα παραδίδεται αντ' αυτού μέσω SMS, TAK και MQTT."
t1:
  other: "SOS από τον κόμβο !a4f2c1, 17 bytes"
t2:
  other: "3 κανόνες ταίριαξαν, επιλέχθηκαν 4 διαδρομές"
t3:
  other: "κάτω από τον ορίζοντα, επόμενη διέλευση σε 11m 38s"
t4:
  other: "smaz2 από 17 σε 11 bytes, SMS στην ομάδα επαφών"
t5:
  other: "θέση ως Cursor-on-Target, παράλληλα"
t6:
  other: "καταγράφηκε για τον πίνακα και τα webhooks"
trace_foot:
  other: "Το δορυφορικό σκέλος απέτυχε και το μήνυμα έφτασε ούτως ή άλλως, σε τρία συστήματα που το πλέγμα δεν φτάνει μόνο του. Οι διαδρομές, η σειρά εφεδρείας και οι αλυσίδες μετασχηματισμού ρυθμίζονται ανά διεπαφή."
tr_title:
  other: "Οκτώ φορείς, εννέα καλωδιωμένες διεπαφές"
tr_sub:
  other: "Κάθε σύστημα συνδέεται ως προσαρμογέας πίσω από την ίδια διεπαφή, με δικό του MTU, μοντέλο κόστους και αλυσίδα μετασχηματισμού, και ένας κανόνας μπορεί να δρομολογεί από οποιονδήποτε προσαρμογέα σε οποιονδήποτε άλλον. Το Iridium μετράει δύο φορές, στο 9603N και στο 9704. Το TAK και τα webhooks είναι ενσωματώσεις, όχι φορείς. Ο ασύρματος HF και το DMR είναι στον οδικό χάρτη και δεν έχουν κατασκευαστεί. Η κατάσταση λέει τι έχουμε πράγματι τρέξει, όχι τι ελπίζουμε."
