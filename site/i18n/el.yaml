and_cap:
  other: "Η αρχική οθόνη σε ένα Pixel 9a: κάθε διέξοδος, και τρία μηνύματα που περιμένουν δορυφόρο"
host_k_ops:
  other: "Αντίγραφα, ενημερώσεις, ασφάλεια"
host_v_ops:
  other: "δική σας ευθύνη"
hub_shot1:
  other: "Επισκόπηση: οι διαδρομές που μπορεί να χρησιμοποιήσει κάθε κιτ αυτή τη στιγμή, η κίνηση της τελευταίας ημέρας και ό,τι χρειάζεται την προσοχή σας (εδώ τίποτα)"
hub_shot2:
  other: "Μηνύματα από κάθε φορέα: η δορυφορική κίνηση από κιτ σε κιτ μένει κρυπτογραφημένη από άκρο σε άκρο, και μια απάντηση φεύγει από το πλαίσιο δίπλα"
hub_shot3:
  other: "Δρομολόγηση με απλά λόγια: ένα δορυφορικό μήνυμα προωθείται σε άλλο κιτ, σε APRS, MQTT και TAK, σε webhooks και σε ειδοποιήσεις"
hub_shots_note:
  other: "Οι ίδιες οθόνες στον δικό σας διακομιστή ή στον δικό μας. Καταγράφηκαν στο hub.meshsat.net στις 21 Σεπτεμβρίου 2026, με θολωμένους αριθμούς τηλεφώνου, IMEI και ονόματα υπολογιστών των κιτ."

