  other: "Δημόσιες προδιαγραφές, σαφή όρια"

ig_modules_intro:
  other: "Τα παρακάτω στοιχεία περιγράφουν εξαρτήματα των κατασκευαστών, όχι ένα ολοκληρωμένο MSC-3. Κάθε υποψήφια μονάδα συνοδεύεται από σύνδεσμο πηγής. Οι δημοσιευμένες δυνατότητες δεν καθορίζουν τις επιτρεπόμενες ρυθμίσεις λειτουργίας."

ig_art_credit:
  other: "Εικονογράφηση: πρωτότυπες ουδέτερες απεικονίσεις της MeshSat. Απλοποιημένες μορφές, χωρίς κλίμακα. Δεν είναι φωτογραφίες προϊόντων, σχέδια πλακετών ή σχέδια συναρμολόγησης. Τα ονόματα κατασκευαστών προσδιορίζουν μόνο τα εξαρτήματα και δεν υποδηλώνουν συνεργασία ή υποστήριξη."

ig_art_caption:
  other: "Ουδέτερη απεικόνιση MeshSat"

ig_art_alt:
