hero_eyebrow:
  other: "Όταν τα δίκτυα πέφτουν, ό,τι επιζεί γίνεται νησιά. Το MeshSat τα συνδέει."
hero_title_a:
  other: "Ένα μήνυμα."
hero_title_b:
  other: "Κάθε δρόμος προς τα έξω."
hero_sub:
  other: "Λογισμικό ανοικτού κώδικα που μεταφέρει μηνύματα μεταξύ ασυρμάτων mesh, δορυφορικών συνδέσεων και δικτύων κινητής. Λειτουργεί σε πύλη Linux ή τηλέφωνο και συνδέει συστήματα που δεν μπορούν να επικοινωνήσουν μόνα τους."
hero_status:
  other: "Το Hub άνοιξε. Κανένας στόλος ακόμη, ποτέ σε πραγματική έκτακτη ανάγκη."
