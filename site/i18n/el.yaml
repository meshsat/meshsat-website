ig_eyebrow:
  other: "ΣΕΙΡΑ MSC-3 / ΤΕΧΝΙΚΗ ΕΠΙΣΚΟΠΗΣΗ"

ig_lead:
  other: "Μια σχεδιαστική ιδέα για πύλη τσέπης που εξυπηρετεί τους ασυρμάτους μιας ομάδας, με Iridium για κείμενο, κατάσταση και θέσεις."

