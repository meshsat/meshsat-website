host_self_price:
  other: "δωρεάν"
is_title:
  other: "Τα δίκτυα σπάνε σε νησιά"
is_sub:
  other: "Μια καταστροφή σπάνια σωπαίνει όλα τα συστήματα μαζί. Κόβει τις συνδέσεις ανάμεσά τους: ο ασύρματος συνεχίζει να δουλεύει μέσα σε μία υπηρεσία ή μία κυψέλη, το τηλεφωνικό δίκτυο πέφτει, και ό,τι ξέρει μια ομάδα δεν φτάνει στην ομάδα που το χρειάζεται."
