films_title:
  other: "Sehen, wie es läuft"
films_sub:
  other: "Zuerst die Einführung, dann zwei Feldkits auf der Werkbank, die eine Nachricht von einem Mesh ins andere weitergeben, über APRS-Funk und danach über SMS."
films_consent:
  other: "Von YouTube wird nichts geladen, bevor Sie auf Abspielen drücken."
