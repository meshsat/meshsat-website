hero_donate:
  other: "MeshSat unterstützen"
trace_title:
  other: "Routing-Protokoll, eine Notmeldung"
trace_bridge:
  other: "bridge tesseract"
trace_alt:
  other: "Beispielhaftes Routing-Protokoll: Ein SOS trifft über LoRa-Mesh ein, der Iridium-Versuch schlägt fehl, weil der Satellit unter dem Horizont steht, und die Nachricht wird stattdessen über SMS, TAK und MQTT zugestellt."
t1:
  other: "SOS von Knoten !a4f2c1, 17 Bytes"
t2:
  other: "3 Regeln zutreffend, 4 Routen gewählt"
t3:
  other: "unter dem Horizont, nächster Überflug in 11m 38s"
t4:
  other: "smaz2 17 auf 11 Bytes, SMS an Kontaktgruppe"
t5:
  other: "Position als Cursor-on-Target, parallel"
t6:
  other: "protokolliert für Dashboard und Webhooks"
trace_foot:
  other: "Die Satellitenstrecke schlug fehl und die Nachricht kam trotzdem an, in drei Systemen, die das Mesh allein nicht erreicht. Routen, Failover-Reihenfolge und Transformationsketten werden je Schnittstelle konfiguriert."
tr_title:
  other: "Jedes System hängt am selben Router"
tr_sub:
  other: "Jedes System ist ein Adapter hinter derselben Schnittstelle, mit eigener MTU, eigenem Kostenmodell und eigener Transformationskette, und eine Regel kann von jedem Adapter zu jedem anderen routen. Der Code an jedem Kanal sagt, wo er wirklich steht, nicht was wir hoffen: Nur LIVE läuft heute auf unserer Hardware."
