plans_airtime:
  other: "Ihre Sendezeit bleibt Ihre. Binden Sie Ihre eigenen Cloudloop, Twilio und Rock7 Konten ein; wir verkaufen weder Satellit noch SMS weiter."
plans_keeps:
  other: "Ein registriertes Gerät funktioniert in jedem Tarif weiter. Ein kleinerer Tarif verhindert nur neue Registrierungen, ein SOS ist nie betroffen."
and_p:
  other: "Ein gewöhnliches Android-Telefon wird zum Gateway, ohne Pi. Gekoppelt mit einem MeshSat-Node im Taschenformat erreicht eine einzige Bluetooth-Verbindung sowohl das Mesh-Funkgerät als auch das Iridium-Modem, und die vollständige APK-Version ergänzt SMS über die eigene SIM-Karte des Telefons. Satellitennachrichten warten in einer Warteschlange auf den nächsten Überflug, den das Telefon ohne Internet vorhersagt."
