tx_aprs:
  other: "APRS (mitgeliefertes Direwolf, KISS)"
tx_rns:
  other: "Reticulum TCP (HDLC-Rahmen)"
tr_note_a:
  other: "Die Bündelung mehrerer Träger über eine kostenpflichtige Satellitenstrecke ist noch nicht validiert, und die Störerkennung hat bisher nur Umgebungsrauschen gesehen."
tr_note_link:
  other: "Das Repository führt die vollständige Liste"
tr_note_b:
  other: "dessen, was belegt ist und was nicht."
cost_title:
  other: "Satellitenbytes sind teuer. Das ist der ganze Entwurf."
cost_sub:
  other: "Eine Iridium-Leitung kostet mehrere zehn Euro im Monat plus Guthaben je Nachricht, abgerechnet in Blöcken zu 340 Bytes. Gibt man jeder Person im Team eine, wächst die Rechnung mit der Teamgröße. Genau dieser Preis ist der Grund, warum es die Routing-Schicht überhaupt gibt."
c1_h:
  other: "Eine bezahlte Strecke, gemeinsam genutzt"
c1_p:
  other: "Ein Team trägt günstige Mesh-Funkgeräte. Ein Gateway hält die teure Satellitenleitung. Alle erreichen die Außenwelt darüber, sodass die Kosten nicht mehr mit der Personenzahl wachsen."
c2_h:
  other: "Kostenlose Träger zuerst"
c2_p:
  other: "Jede Schnittstelle gibt Kosten an. Der Router bevorzugt die kostenlosen, also Mesh, Packet Radio, Bluetooth und WLAN, und greift erst zu Satellit oder SMS, wenn nichts Kostenloses verfügbar ist."
c3_h:
  other: "Und dann möglichst wenige Bytes"
c3_p:
  other: "Alles, was über einen kostenpflichtigen Träger geht, wird zuerst komprimiert. SMAZ2 braucht dafür bei kurzem Text unter einer Millisekunde, was zählt, wenn pro Block statt pro Byte abgerechnet wird."
c4_h:
  other: "Gesendet, wenn der Himmel stimmt"
c4_p:
  other: "Überflugvorhersage aus SGP4-Bahndaten hält Verkehr bis zum Sichtbarkeitsfenster zurück, statt Akku für Versuche gegen einen Satelliten unter dem Horizont zu verbrauchen."
funding_a:
  other: "MeshSat ist freie Software unter der GPLv3. Die Entwicklung wird gefördert von"
funding_b:
  other: ", und ein sechsmonatiges Feldprogramm beginnt im November 2026."
hw_title:
  other: "Worauf es läuft"
hw_sub:
  other: "Ein Raspberry Pi in einem wasserdichten Koffer, mit Funkgeräten an USB und GPIO. Geräte werden beim Start über USB-Kennung und Protokolltest erkannt, das Anstecken ist also die gesamte Konfiguration."
th_part:
  other: "Komponente"
th_role:
  other: "Funktion"
hw1:
  other: "Host. ARM64 oder jedes x86_64-Linux mit Docker und USB-Seriell."
hw2:
  other: "Meshtastic-Mesh-Funk auf 868 oder 915 MHz."
hw3:
  other: "Iridium-Satellit. SBD mit 340 Bytes oder IMT mit 100 KB."
hw4:
  other: "4G und 2G Mobilfunk, für SMS und Daten."
hw5:
  other: "ZigBee-Koordinator."
hw6:
  other: "USV und Akku"
hw6r:
  other: "Weil die interessanten Fälle genau die sind, in denen auch der Netzstrom weg ist."
cap1:
  other: "Signal, Verkehr und Kanalzustand, vom Gerät selbst ausgeliefert"
cap2:
  other: "Überflugvorhersage, damit die Warteschlange auf einen wirklich sichtbaren Satelliten wartet"
cap3:
  other: "Mesh-Topologie in Echtzeit"
cap4:
  other: "Weiterleitungsregeln und Status je Gateway"
hw_note:
  other: "Das Dashboard steckt in der Binärdatei und wird vom Gerät ausgeliefert. Keine Cloud, kein Konto."
hw_repo_a:
  other: "Die Hardware hat ein eigenes Repository, "
hw_repo_b:
  other: ": die beiden bisher gebauten Kits mit ihrer Bauanleitung und die V2-Trägerplatinen für einen Peli 1520 Koffer, entworfen und für die Fertigung vorbereitet, aber noch nicht gebaut."
nf_title:
  other: "Was es nicht ist"
nf_sub:
  other: "Am schnellsten verliert man einen Nachmittag, wenn man das Falsche davon erwartet."
nf1_h:
  other: "Kein Ersatz für Starlink"
nf1_p:
  other: "MeshSat bewegt Text, Positionen und Telemetrie. Wer Videoanrufe oder das Web braucht, nimmt Starlink. Dies ist für die Fälle, die eine Schüssel nicht abdeckt: akkubetrieben, hosentaschengroß, ohne Netzstrom."
nf2_h:
  other: "Keine Sprache, kein Video"
nf2_p:
  other: "Satelliten- und Mesh-Strecken haben hohe Latenz und geringen Durchsatz. Dies ist Store-and-Forward-Nachrichtenverkehr. Eher SMS als Telefonat."
nf3_h:
  other: "Kein LoRaWAN-Netzwerkserver"
nf3_p:
  other: "Die Mesh-Seite spricht Meshtastic, ein eigenes Protokoll über LoRa. Für LoRaWAN ChirpStack betreiben und per MQTT anbinden."
nf4_h:
  other: "Kein Notrufdienst"
nf4_p:
  other: "Ein Forschungsprototyp, kein Ersatz für 112 oder eine andere nationale Notrufnummer. Nichts davon ist zertifiziert und nichts davon wurde in einem echten Notfall eingesetzt."
sys_title:
  other: "Der Rest des Systems"
sys_sub:
  other: "Die Bridge ist ein einzelnes Gerät und arbeitet vollständig eigenständig. Zwei weitere Teile gibt es für den Fall, dass ein Gerät nicht das ganze Bild ist."
hub_badge:
  other: "Geschlossene Beta"
hub_status:
  other: "MeshSat Hub ist noch nicht gestartet. Er läuft als geschlossene Beta auf unserer eigenen Infrastruktur. Zugang für Demos und Beta-Tests wird auf Anfrage eingerichtet."
hub_p:
  other: "Flottenverwaltung über viele Bridges: OAuth2- und OIDC-Konten, API-Schlüssel mit Rollen, Mandantentrennung, SOS-Eskalationsketten, Ratenbegrenzung je Gerät und ein Ed25519-Hash-Chain-Auditlog. Betreibbar einzeln, im Cluster oder auf Kubernetes."
hub_cta:
  other: "Beta-Zugang anfragen"
and_p:
  other: "Ein Telefon als eigenständiges Gateway, ohne Pi und ohne Kabel. Es spricht mit einem Meshtastic-Funkgerät über Bluetooth LE, mit einem Iridium-Modem über Bluetooth SPP und nutzt die eigene SMS des Telefons, alles gleichzeitig. Gleiche Verschlüsselung und gleiche Nachrichtenformate wie die Bridge."
and_cta:
  other: "Android-Quellcode"
cta_title:
  other: "Ausprobieren"
cta_sub:
  other: "Ein Befehl auf einem Linux-Rechner mit angeschlossenem Funkgerät. Ein einzelnes Gerät genügt zum Start, und was fehlt, wird als Warnung protokolliert, nicht als Fehler."
cta_source:
  other: "Quellcode ansehen"
cta_docs:
  other: "Dokumentation"
cta_matrix:
  other: "Auf Matrix fragen"
cta_note:
  other: "Fehlerberichte von Leuten mit Hardware, die wir nicht ausprobiert haben, sind das Nützlichste, was Sie schicken können. Die Liste unterstützter Geräte ist kurz, weil dort nur steht, was wir physisch betrieben haben."
