ig_study_intro:
  other: "Eine kleine farbige E-Paper-Anzeige, kompatibel mit dem Raspberry Pi, wird evaluiert. Diese Ansichten untersuchen Gehäuse und Bedienelemente; Ergonomie und Antennenpositionierung müssen noch getestet werden."

