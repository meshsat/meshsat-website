hero_eyebrow:
  other: "Wenn Netze ausfallen, zerfällt, was übrig bleibt, in Inseln. MeshSat verbindet sie."
hero_title_a:
  other: "Eine Nachricht."
hero_title_b:
  other: "Jeder Weg hinaus."
hero_sub:
  other: "Open-Source-Software, die Nachrichten zwischen Mesh-Funkgeräten, Satellitenverbindungen und Mobilfunknetzen überträgt. Sie läuft auf einem Linux-Gateway oder Telefon und verbindet Systeme, die einander allein nicht erreichen."
hero_status:
  other: "Hub offen. Noch keine Flotte im Einsatz, nie in einem echten Notfall verwendet."
hero_star:
  other: "Auf GitHub einen Stern geben"
hero_visitors:
