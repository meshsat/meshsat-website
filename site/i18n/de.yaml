is_title:
  other: "Netze zerfallen in Inseln"
is_sub:
  other: "Eine Katastrophe legt selten alle Systeme zugleich still. Sie trennt die Verbindungen dazwischen: Der Funk arbeitet innerhalb einer Behörde oder einer Funkzelle weiter, das Telefonnetz fällt aus, und was ein Team weiß, erreicht das Team nicht, das es braucht."
is_record_h:
  other: "Das ist schon passiert"
is_joins_h:
  other: "So sieht das Verbinden aus"
is_to:
  other: "nach"
join1_h:
  other: "Zwei Teams in zwei Meshes, kein Internet"
join1_s:
  other: "Am 12. September 2026 von Kit zu Kit über APRS und danach über SMS betrieben. Es ist das zweite Video unten."
join2_h:
  other: "Ein Tal ohne Empfang, ein Büro weit weg"
join2_s:
  other: "Die Satellitenstrecke ist über eine echte Iridium-Verbindung bestätigt, März 2026."
join3_h:
  other: "Ein Funknetz von Freiwilligen und eine Einsatzleitung"
join3_s:
  other: "Beide Schnittstellen sind im Feld erprobt. Diese Route wurde noch nicht durchgehend betrieben."
is_who:
  other: "Gebaut für die Menschen, die zwischen diesen Inseln arbeiten: Such- und Rettungsteams, Katastrophenschutz und Krisenmanagement, humanitäre Organisationen, Notfunkgruppen von Funkamateuren, Expeditionen, Schiffsbesatzungen und abgelegene Industrie. Noch nutzt es keiner von ihnen; das Feldprogramm, das im November 2026 beginnt, ist der erste echte Test."
inc1_h:
  other: "Hurrikan Katrina, US-Golfküste."
inc1_p:
  other: "In vielen Fällen konnten Einsatzkräfte verschiedener Behörden wegen unvereinbarer Frequenzzuteilungen nicht miteinander sprechen. Ein Militärhubschrauber musste eine Flaschenpost abwerfen, um sie vor einem Gasleck zu warnen."
inc1_src:
  other: "Bericht des FCC-Gremiums"
inc2_h:
  other: "Hochwasser im Ahrtal und in der Eifel."
inc2_p:
  other: "34 Basisstationen des BOS-Digitalfunks waren betroffen. Im Rückfallbetrieb funktionierte der Funk nur noch innerhalb der eigenen Funkzelle, und die überörtliche Kommunikation wurde im Einzelfall überbrückt, etwa mit Gateway-Schaltungen."
inc2_src:
  other: "Landtag Rheinland-Pfalz, Drucksache 18/1947"
inc3_h:
  other: "Waldbrand in Lahaina, Maui."
inc3_p:
  other: "Das Funksystem der Sicherheitsbehörden des Countys scheint durchgehend funktioniert zu haben, doch die Polizei konnte die Kanäle der Feuerwehr nicht hören und die Feuerwehr die der Polizei nicht, und unzuverlässiger Mobilfunk ließ private Tankwagen ohne Koordination."
inc3_src:
  other: "FSRI-Bericht für den Generalstaatsanwalt von Hawaii"
inc4_h:
  other: "Stromausfall in Spanien und Portugal."
inc4_p:
  other: "Die öffentlichen Fest- und Mobilfunknetze fielen aus, und Portugals Verteilnetzbetreiber wich auf Satellitentelefone aus. Spaniens Übertragungsnetzbetreiber konnte noch telefonieren, erreichte aber die Verteilnetzleitstelle in Sevilla nicht, und der Netzwiederaufbau in Andalusien wurde unterbrochen."
inc4_src:
  other: "Bericht des ENTSO-E-Expertengremiums"
