  other: "Eine Funkkombination erkunden"

ig_config_intro:
  other: "Wählen Sie ein oder zwei lokale Funkmodule. Dies beschreibt ein Integrationskonzept; es bestätigt nicht, dass eine Kombination ins Gehäuse passt oder mit einer bestimmten Funkgeräteflotte funktioniert."

