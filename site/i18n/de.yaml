ig_capabilities_intro:
  other: "Vorgesehene Nachrichtenwege zur Evaluierung. Jedes Konzept mit einem Funkmodul enthält Iridium; ein Konzept mit zwei Funkmodulen verbindet auch die lokalen Funkmodule miteinander."

