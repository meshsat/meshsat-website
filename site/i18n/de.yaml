hero_eyebrow:
  other: "Quelloffenes Routing zwischen Funkgeräten, die einander nicht erreichen"
hero_title_a:
  other: "Eine Nachricht."
hero_title_b:
  other: "Jeder Weg hinaus."
hero_sub:
  other: "Ein Mesh hält ein Dorf im Gespräch mit sich selbst, hat aber keinen Weg aus dem Tal heraus. Ein Satellitenmodem erreicht die ganze Welt und kostet echtes Geld pro Nachricht. MeshSat ist die Schicht dazwischen: Es nimmt eine Nachricht aus dem Mesh und sendet sie über den Träger, der noch funktioniert, und gibt Satellitenbytes erst aus, wenn nichts Kostenloses mehr übrig ist."
hero_status:
  other: "Prototyp vor der Veröffentlichung. Nie bei echten Nutzern eingesetzt, nie in einem Notfall verwendet."
hero_star:
  other: "Auf GitHub einen Stern geben"
hero_visitors:
  other: "Besucher"
hero_donate:
  other: "Auf Ko-fi unterstützen"
trace_title:
  other: "Routing-Protokoll, eine Notmeldung"
trace_bridge:
  other: "bridge tesseract"
trace_alt:
  other: "Beispielhaftes Routing-Protokoll: Ein SOS trifft über LoRa-Mesh ein, der Iridium-Versuch schlägt fehl, weil der Satellit unter dem Horizont steht, und die Nachricht wird stattdessen über SMS, TAK und MQTT zugestellt."
t1:
  other: "SOS von Knoten !a4f2c1, 17 Bytes"
t2:
  other: "3 Regeln zutreffend, 4 Routen gewählt"
t3:
  other: "unter dem Horizont, nächster Überflug in 11m 38s"
t4:
  other: "smaz2 17 auf 11 Bytes, SMS an Kontaktgruppe"
t5:
  other: "Position als Cursor-on-Target, parallel"
t6:
  other: "protokolliert für Dashboard und Webhooks"
trace_foot:
  other: "Die Satellitenstrecke schlug fehl und die Nachricht kam trotzdem an. Das ist das ganze Produkt. Routen, Failover-Reihenfolge und Transformationsketten werden je Schnittstelle konfiguriert."
tr_title:
  other: "Acht Träger, neun verdrahtete Schnittstellen"
tr_sub:
  other: "Iridium läuft auf zwei Modems, dem 9603N für SBD und dem 9704 für IMT. Jeder Träger ist eine vollwertige Schnittstelle mit eigener MTU, eigenem Kostenmodell und eigener Transformationskette. TAK und Webhooks sind Integrationen, keine Träger. Der Status nennt, was wir tatsächlich betrieben haben, nicht was wir hoffen."
