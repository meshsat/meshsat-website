hero_eyebrow:
  other: "Wenn Netze ausfallen, zerfällt, was übrig bleibt, in Inseln. MeshSat verbindet sie."
hero_title_a:
  other: "Eine Nachricht."
hero_title_b:
  other: "Jeder Weg hinaus."
hero_sub:
  other: "Ein Mesh, das ein Tal im Gespräch hält, ein Funknetz von Freiwilligen, ein Satellitenmodem, die Lagekarte einer Einsatzleitung: Jedes kann noch funktionieren, und keines erreicht die anderen. MeshSat ist quelloffene Software, die eine Nachricht aus dem einen nimmt und im anderen zustellt, über den Träger, der noch funktioniert, und Satellitenbytes erst ausgibt, wenn nichts Kostenloses mehr übrig ist."
hero_status:
  other: "Hub offen. Noch keine Flotte im Einsatz, nie in einem echten Notfall verwendet."
hero_star:
  other: "Auf GitHub einen Stern geben"
hero_visitors:
  other: "Besucher"
hero_donate:
  other: "MeshSat unterstützen"
trace_title:
  other: "Routing-Protokoll, eine Notmeldung"
trace_bridge:
  other: "bridge tesseract"
trace_alt:
  other: "Beispielhaftes Routing-Protokoll: Ein SOS trifft über LoRa-Mesh ein, der Iridium-Versuch schlägt fehl, weil der Satellit unter dem Horizont steht, und die Nachricht wird stattdessen über SMS, TAK und MQTT zugestellt."
t1:
  other: "SOS von Knoten !a4f2c1, 17 Bytes"
t2:
  other: "3 Regeln zutreffend, 4 Routen gewählt"
t3:
  other: "unter dem Horizont, nächster Überflug in 11m 38s"
t4:
  other: "smaz2 17 auf 11 Bytes, SMS an Kontaktgruppe"
t5:
  other: "Position als Cursor-on-Target, parallel"
t6:
  other: "protokolliert für Dashboard und Webhooks"
trace_foot:
  other: "Die Satellitenstrecke schlug fehl und die Nachricht kam trotzdem an, in drei Systemen, die das Mesh allein nicht erreicht. Routen, Failover-Reihenfolge und Transformationsketten werden je Schnittstelle konfiguriert."
tr_title:
  other: "Jedes System hängt am selben Router"
tr_sub:
  other: "Jedes System ist ein Adapter hinter derselben Schnittstelle, mit eigener MTU, eigenem Kostenmodell und eigener Transformationskette, und eine Regel kann von jedem Adapter zu jedem anderen routen. Heute laufen acht Träger auf neun Schnittstellen, weil Iridium doppelt zählt, mit dem 9603N und dem 9704. HF-Funk und DMR stehen auf der Roadmap und sind nicht gebaut. Der Status nennt, was wir tatsächlich betrieben haben, nicht was wir hoffen."
