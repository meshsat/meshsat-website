ig_modules_eyebrow:
  other: "04 / MODULE IN EVALUIERUNG"

ig_modules_title:
  other: "Öffentliche Spezifikationen, klare Grenzen"

ig_modules_intro:
  other: "Die folgenden Angaben beschreiben die Komponenten der Hersteller, kein fertiges MSC-3-Gerät. Jeder Kandidat ist mit einer Quelle verlinkt. Veröffentlichte Funkfähigkeiten belegen keine zulässigen Betriebseinstellungen."

ig_art_credit:
  other: "Illustrationen: eigene neutrale Darstellungen von MeshSat. Vereinfachte Formen, nicht maßstabsgetreu; keine Produktfotos, Leiterplattenlayouts oder Montagezeichnungen. Herstellernamen dienen nur der Identifikation der Komponenten und implizieren weder Partnerschaft noch Unterstützung."

ig_art_caption:
  other: "Neutrale MeshSat-Illustration"

ig_art_alt:
  other: "eigene neutrale MeshSat-Illustration, kein Produktfoto"

ig_specs_caption:
  other: "öffentliche Komponentenspezifikationen"

ig_cases_eyebrow:
  other: "05 / ANWENDUNGEN ZUR EVALUIERUNG"

ig_cases_title:
  other: "Integrationsszenarien"

ig_cases_intro:
  other: "Dies sind Forschungsszenarien. Es werden weder Kundeneinsätze noch Flottenkompatibilität oder betriebliche Freigaben behauptet."

ig_case_tl_title:
  other: "TETRA-Teams und freiwillige Mesh-Nutzer"

ig_case_tl_body:
  other: "Den Austausch ausgewählter Texte und Positionen zwischen einem professionellen Funkteam und Freiwilligen mit Meshtastic evaluieren, mit Iridium für Meldungen aus der Ferne. Routingregeln steuern, was die Grenze passieren darf."

ig_case_td_title:
  other: "Teams mit verschiedenen Funksystemen"

ig_case_td_body:
  other: "Den Nachrichtenaustausch zwischen TETRA- und DMR-Teams im Direktmodus evaluieren. Flottenspezifische Datenformate, Kanalberechtigungen und der Umgang mit Verschlüsselung müssen zuerst geklärt werden."

ig_case_dl_title:
  other: "DMR-Teams und lokale Sensoren"

ig_case_dl_body:
  other: "DMR-Texte und unterstützte Positionsdaten zusammen mit Meshtastic-Feldmeldungen evaluieren. Testen, welche Nachrichtentypen umgesetzt und über den gemeinsamen Satellitenweg weitergeleitet werden können."

ig_contact_eyebrow:
  other: "TECHNISCHES GESPRÄCH"

ig_contact_title:
  other: "Ihr Funkgerät, Ihr Anwendungsfall."

ig_contact_intro:
  other: "Nennen Sie uns Funkgerätemodelle, Direktmodus-Konfiguration, Nachrichtentypen, Einsatzland und Integrationsendpunkt, die Sie evaluieren möchten."

ig_contact_note:
  other: "Forschungs- und Entwicklungskonzepte. Module in Evaluierung."

ig_details:
  other: "Komponentenspezifikationen"

ig_radio_key:
  other: "Kennbuchstaben der lokalen Funkmodule"

ig_render_caption:
  other: "Konzeptdarstellung für Forschung und Entwicklung von MeshSat. Gehäuse, Hardware und HF-Integration sind noch nicht verifiziert."

ig_render_alt:
  other: "MSC-3T-Gehäusekonzept mit kleiner farbiger E-Paper-Anzeige, kompakter Iridium-Antenne und TETRA-Stabantenne"

ig_exploded_alt:
  other: "Explosionsdarstellung des MSC-3T-Konzepts mit Anzeige, Rechnerplatine, Satellitenmodem, Funkmodul und Akku; mechanische Integration nicht verifiziert"

ig_radio_t_data:
  other: "SDS-Texte, Status- und Positionsmeldungen"

ig_radio_t_limit:
  other: "Lizenzierte TETRA-Kanäle. Die Interoperabilität von SDS, Status und Position im Direktmodus muss mit den Teamgeräten validiert werden. Der Direktmodus des BDM 31 3L ist unbestätigt."

ig_radio_d_data:
  other: "Text; Status und Positionen hängen von Modul und Funkgeräteflotte ab"

ig_radio_d_limit:
  other: "Lizenzierte DMR-Kanäle. Textformate, Positionsprotokolle und Verschlüsselung unterscheiden sich je nach Funkgeräteflotte. Die öffentliche NiceRF-Befehlsliste dokumentiert keinen Positionsbefehl. Herstellerübergreifende Daten- und Verschlüsselungsinteroperabilität sind nicht verifiziert."

ig_radio_l_data:
  other: "Meshtastic-Text- und Positionspakete"

ig_radio_l_modules:
  other: "Funkmodul auf Basis des Semtech SX1262"

ig_radio_l_limit:
  other: "Regionale Grenzen für Frequenzband, Sendeleistung und Tastgrad gelten. Ein Meshtastic-Host und kompatible Firmware sind erforderlich; der SX1262-Chip allein führt Meshtastic nicht aus."

ig_radio_a_data:
  other: "Amateurfunktexte, Status und Positionen"

ig_radio_a_limit:
  other: "Nur Amateurfunk. Ein lizenzierter Funkamateur ist erforderlich. Keine Verschlüsselung. Nicht für Behördenverkehr; Routen zu APRS müssen diese Grenze durchsetzen."

ig_radio_h_data:
  other: "Ausgewählte Anwendungsnachrichten über eine lokale IP-Verbindung"

ig_radio_h_limit:
  other: "Regionale Band- und Leistungsgrenzen gelten. Kompatible HaLow-Gegenstellen sind erforderlich. Der Satellitenweg transportiert ausgewählte Nachrichten, keine Breitband-IP-Verbindung. Platinenwahl und Hostintegration werden evaluiert."

ig_radio_g_name:
  other: "2G-Zelle"

ig_radio_g_data:
  other: "SMS von Telefonen, die an einer lokalen GSM-Zelle angemeldet sind"

ig_radio_g_modules:
  other: "PlutoSDR mit Osmocom"

ig_radio_g_limit:
  other: "Standortbezogene Lizenz erforderlich. Jeder Einsatz benötigt eine eigene Funkgenehmigung. SIM-Bereitstellung, Spektrum, Timing, HF-Filterung und Rechenkapazität müssen validiert werden. Dies ist eine lokale Zelle, kein Roaming in öffentlichen Netzen."

ig_tw1m_note:
  other: "Abmessungen aus der öffentlichen Broschüre. Positionsverarbeitung und Flotteninteroperabilität erfordern eine Validierung am Prüfstand."

ig_tw1m_sourceLabel:
