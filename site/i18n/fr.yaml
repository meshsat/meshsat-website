ig_enclosure:
  other: "Boîtier / alimentation"

ig_enclosure_value:
  other: "Boîtier de poche robuste et batterie."

ig_enclosure_limit:
  other: "Les dimensions, la masse, l'autonomie, l'indice de protection et la conception de la recharge ne sont pas vérifiés."

ig_display:
  other: "Afficheur d'état"

ig_display_value:
  other: "Petit afficheur à papier électronique couleur compatible avec le Raspberry Pi, en cours d'évaluation."

ig_display_limit:
  other: "La dalle, le pilote, l'interface, la consommation et l'intégration mécanique nécessitent une validation."

ig_routing_label:
  other: "Routage des messages"

ig_routing_value:
  other: "De radio locale à radio locale et de radio locale à Iridium, dans les deux sens."

ig_routing_limit:
  other: "Seuls les types de messages pris en charge peuvent emprunter une route. La conversion des protocoles et les limites de chiffrement nécessitent une validation."

ig_integration_status:
  other: "État de l'intégration"

ig_every_variant:
  other: "Toutes les variantes MSC-3."

ig_integration_limit:
  other: "Les spécifications des modules ne démontrent ni certification de l'appareil, ni homologation pour un parc radio, ni performances de bout en bout."

ig_capabilities_eyebrow:
  other: "02 / MATRICE DES CAPACITÉS"

ig_capabilities_title:
  other: "Interfaces locales, chemin satellitaire commun"

ig_capabilities_intro:
  other: "Chemins de messages envisagés pour l'évaluation. Chaque concept à une radio inclut Iridium ; un concept à deux radios relie aussi les radios locales entre elles."

ig_scroll:
  other: "Sur un petit écran, faites défiler le tableau horizontalement pour lire les limites."

ig_matrix_label:
  other: "Matrice des capacités MSC-3"

ig_matrix_caption:
  other: "Toutes les variantes : FUTURE PLAN. Tous les modules cités : en cours d'évaluation."

ig_variant:
  other: "Variante"

ig_radio:
  other: "Radio locale"

ig_messages:
  other: "Messages envisagés"

ig_limits:
  other: "Limites à résoudre"

ig_config_eyebrow:
  other: "03 / CONFIGURATEUR RADIO"

ig_config_title:
  other: "Explorer une combinaison radio"

ig_config_intro:
  other: "Choisissez une ou deux radios locales. Il s'agit d'un concept d'intégration ; cela ne confirme ni que la combinaison tient dans le boîtier, ni qu'elle fonctionne avec un parc radio particulier."

ig_slots:
  other: "Emplacements des radios locales"

ig_none:
  other: "Aucune seconde radio"

ig_always:
  other: "Toujours intégré"

ig_module_evaluation:
  other: "Module en cours d'évaluation"

ig_nojs:
  other: "Activez JavaScript pour modifier la sélection. L'exemple MSC-3TL et la matrice complète des capacités restent lisibles sans JavaScript."

ig_result:
  other: "CONCEPT RÉSULTANT"

ig_bridge_two:
  other: "Liaison envisagée : {first} et {second} entre elles, et toutes deux vers Iridium. Les messages de retour suivent les mêmes chemins lorsque les formats et les règles de routage le permettent."

ig_bridge_one:
  other: "Liaison envisagée : {first} vers Iridium et en retour, lorsque les formats et les règles de routage le permettent."

ig_under_evaluation:
  other: "En cours d'évaluation"

ig_iridium_limit:
  other: "Iridium : module en cours d'évaluation. Nécessite une antenne agréée, un service satellitaire et une vue suffisamment dégagée du ciel. Les délais de remise et les performances MSC-3 ne sont pas vérifiés."

ig_contact:
  other: "Nous contacter"

ig_mail_subject:
  other: "échange sur l'intégration"

ig_mail_body:
  other: "Radios locales : {radios}\nToujours intégré : Iridium / RockBLOCK 9704 (module en cours d'évaluation)\n\nModèles de radios et types de messages :\nPays et site de déploiement :\nPoint d'intégration :\n"

ig_modules_eyebrow:
  other: "04 / MODULES EN COURS D'ÉVALUATION"

ig_modules_title:
  other: "Spécifications publiques, limites explicites"

ig_modules_intro:
  other: "Les données ci-dessous décrivent les composants des fabricants, pas un MSC-3 achevé. Chaque candidat est accompagné d'un lien vers sa source. Les capacités radio publiées ne déterminent pas les réglages d'exploitation autorisés."

ig_art_credit:
  other: "Illustrations : créations neutres originales de MeshSat. Formes simplifiées, non à l'échelle ; ni photographies de produits, ni schémas de circuits imprimés, ni plans d'assemblage. Les noms des fabricants identifient uniquement les composants et n'impliquent aucun partenariat ni soutien."

ig_art_caption:
  other: "Illustration neutre MeshSat"

ig_art_alt:
  other: "illustration neutre originale de MeshSat, pas une photographie du produit"

ig_specs_caption:
  other: "spécifications publiques du composant"

ig_cases_eyebrow:
  other: "05 / USAGES À ÉVALUER"

ig_cases_title:
  other: "Scénarios d'intégration"

ig_cases_intro:
  other: "Il s'agit de scénarios de recherche. Aucun déploiement chez un client, aucune compatibilité avec un parc radio ni aucune autorisation opérationnelle ne sont revendiqués."

ig_case_tl_title:
  other: "Équipes TETRA et réseau maillé bénévole"

ig_case_tl_body:
  other: "Évaluer l'échange de textes et de positions sélectionnés entre une équipe radio professionnelle et des bénévoles utilisant Meshtastic, avec Iridium pour les comptes rendus distants. Les règles de routage contrôlent les échanges entre les réseaux."

ig_case_td_title:
  other: "Équipes utilisant des systèmes radio différents"

ig_case_td_body:
  other: "Évaluer les échanges de messages entre équipes TETRA et DMR en mode direct. Les formats propres aux parcs radio, les autorisations de canaux et le traitement du chiffrement doivent d'abord être établis."

ig_case_dl_title:
  other: "Équipes DMR et capteurs locaux"

ig_case_dl_body:
  other: "Évaluer les textes DMR et les données de position prises en charge, ainsi que les comptes rendus Meshtastic sur le terrain. Tester les types de messages pouvant être convertis et transmis par le chemin satellitaire commun."

ig_contact_eyebrow:
  other: "ÉCHANGE TECHNIQUE"

ig_contact_title:
  other: "Parlons de votre radio et de votre usage."

ig_contact_intro:
  other: "Indiquez les modèles de radios, la configuration en mode direct, les types de messages, le pays de déploiement et le point d'intégration à évaluer."

ig_contact_note:
  other: "Concepts de recherche et développement. Modules en cours d'évaluation."

ig_details:
  other: "Spécifications du composant"

ig_radio_key:
  other: "Lettres des radios locales"

ig_render_caption:
  other: "Rendu conceptuel de R&D par MeshSat. Le boîtier, le matériel et l’intégration RF restent à vérifier."

ig_render_alt:
  other: "Concept de boîtier MSC-3T avec petit afficheur à papier électronique couleur, antenne Iridium compacte et antenne fouet TETRA"

ig_exploded_alt:
  other: "Vue éclatée du concept MSC-3T montrant afficheur, carte de calcul, modem satellitaire, module radio et batterie ; intégration mécanique non vérifiée"

ig_radio_t_data:
  other: "Textes SDS, états et rapports de position"

ig_radio_t_limit:
  other: "Canaux TETRA soumis à autorisation. L'interopérabilité des SDS, états et positions en mode direct doit être validée avec les radios de l'équipe. Le mode direct du BDM 31 3L n'est pas confirmé."

ig_radio_d_data:
  other: "Texte ; les états et positions dépendent du module et du parc radio"

ig_radio_d_limit:
  other: "Canaux DMR soumis à autorisation. Les formats de texte, protocoles de position et chiffrements varient selon le parc radio. La liste publique des commandes NiceRF ne documente aucune commande de position. L'interopérabilité des données et du chiffrement entre fabricants n'est pas vérifiée."

ig_radio_l_data:
  other: "Paquets de texte et de position Meshtastic"

ig_radio_l_modules:
  other: "Radio basée sur le Semtech SX1262"

ig_radio_l_limit:
  other: "Les limites régionales de bande, puissance d'émission et rapport cyclique s'appliquent. Un hôte Meshtastic et un micrologiciel compatible sont requis ; la puce SX1262 seule n'exécute pas Meshtastic."

ig_radio_a_data:
  other: "Textes, états et positions radioamateurs"

ig_radio_a_limit:
  other: "Radioamateur uniquement. Un opérateur titulaire d'une licence est requis. Aucun chiffrement. Pas de trafic des services publics ; les routes vers APRS doivent faire respecter cette limite."

ig_radio_h_data:
  other: "Messages applicatifs sélectionnés sur une liaison IP locale"

ig_radio_h_limit:
  other: "Les limites régionales de bande et de puissance s'appliquent. Des équipements HaLow compatibles sont requis. Le chemin satellitaire transporte des messages sélectionnés, pas une connexion IP haut débit. Le choix de la carte et l'intégration de l'hôte sont en cours d'évaluation."

ig_radio_g_name:
  other: "Cellule 2G"

ig_radio_g_data:
  other: "SMS de téléphones enregistrés sur une cellule GSM locale"

ig_radio_g_modules:
  other: "PlutoSDR avec Osmocom"

ig_radio_g_limit:
  other: "Autorisation propre à chaque site. Chaque déploiement nécessite sa propre autorisation radio. Le provisionnement des SIM, le spectre, la synchronisation, le filtrage RF et la capacité de calcul doivent être validés. Il s'agit d'une cellule locale, pas d'itinérance sur les réseaux publics."

ig_tw1m_note:
  other: "Dimensions issues de la brochure publique. La gestion des positions et l'interopérabilité avec le parc radio nécessitent une validation sur banc."

ig_tw1m_sourceLabel:
  other: "Fiche technique publique Airbus, 03/2018 (copie Senop)"

ig_tw1m_fact_2_1:
  other: "RS-232 ou USB ; commandes AT"

ig_tw1m_fact_3_1:
  other: "SDS et états en DMO ; GPS"

ig_bdm31_note:
  other: "La fiche publique ne mentionne que le TMO. La prise en charge du DMO, nécessaire au concept de radios d'équipe, n'est pas confirmée."

ig_bdm31_sourceLabel:
  other: "Fiche technique publique PMR-R & D, V1.1"

ig_bdm31_fact_1_1:
  other: "1.8 W, classe 3L"

ig_bdm31_fact_2_1:
  other: "3.7 V ; 3.0 A pendant une salve d'émission"

ig_bdm31_fact_3_1:
  other: "PEI (ETSI EN 300 392-5) ; série / RS-232"

ig_mt100_note:
  other: "La fiche mentionne DMRA AES-128/256 et ARC4. Cela ne démontre pas l'interopérabilité avec les fonctions de texte, de position ou de chiffrement d'un parc radio."

ig_mt100_sourceLabel:
  other: "Fiche technique publique Leonardo, mm08909, 09/2020"

ig_mt100_fact_2_1:
  other: "7.4 V ; jusqu'à 2 A"

ig_mt100_fact_3_1:
  other: "UART 3.3 V ; commandes AT ; IP sur DMR"

ig_dmr818_note:
  other: "Les commandes de texte sont documentées, mais pas de commande de position. La compatibilité du chiffrement et du texte avec les autres radios reste non vérifiée."

ig_dmr818_sourceLabel:
