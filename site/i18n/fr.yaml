ig_notice:
  other: "Des concepts d'appareils au stade de la recherche et du développement, en cours d'essai par notre équipe."

ig_notice_detail:
  other: "Toutes les variantes MSC-3 sont des concepts. Les modules sont en cours d'évaluation."

ig_eyebrow:
  other: "SÉRIE MSC-3 / DOSSIER D'INTÉGRATION"

ig_lead:
  other: "Un concept de passerelle de poche pour les radios d'une équipe, avec Iridium pour les textes, les messages d'état et les positions."

ig_intro:
