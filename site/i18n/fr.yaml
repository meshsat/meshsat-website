plans_keeps:
  other: "Un appareil déjà enregistré continue de fonctionner sur toutes les formules. Une formule plus petite empêche seulement d'en ajouter, et un SOS n'est jamais affecté."
and_p:
  other: "Un téléphone Android ordinaire devient la passerelle, sans Raspberry Pi. Associé à un nœud MeshSat de poche, il atteint la radio mesh et le modem Iridium par une seule liaison Bluetooth, et la version APK complète ajoute les SMS via la carte SIM du téléphone. Les messages satellite attendent dans une file le prochain passage, que le téléphone prédit sans internet."
