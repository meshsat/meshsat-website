is_title:
  other: "Les réseaux se brisent en îles"
is_sub:
  other: "Une catastrophe fait rarement taire tous les systèmes à la fois. Elle coupe les liens entre eux : la radio continue de fonctionner au sein d'un service ou d'une cellule, le réseau téléphonique tombe, et ce qu'une équipe sait n'atteint pas l'équipe qui en a besoin."
is_record_h:
  other: "C'est déjà arrivé"
is_joins_h:
  other: "À quoi ressemble la jonction"
is_to:
  other: "vers"
join1_h:
  other: "Deux équipes sur deux maillages, sans internet"
join1_s:
  other: "Testé de kit à kit le 12 septembre 2026 par APRS, puis par SMS. C'est la deuxième vidéo ci-dessous."
join2_h:
  other: "Une vallée sans réseau, un bureau au loin"
join2_s:
  other: "La liaison satellite est confirmée sur une vraie liaison Iridium, mars 2026."
join3_h:
  other: "Un réseau radio de bénévoles et un poste de commandement"
join3_s:
  other: "Les deux interfaces sont testées sur le terrain. Cette route n'a pas encore été exécutée de bout en bout."
is_who:
  other: "Conçu pour les personnes qui travaillent entre ces îles : équipes de recherche et de sauvetage, sécurité civile et gestion de crise, organisations humanitaires, réseaux d'urgence de radioamateurs, expéditions, équipages en mer et industrie isolée. Aucune ne l'utilise encore ; le programme de terrain qui commence en novembre 2026 en est le premier vrai test."
inc1_h:
  other: "Ouragan Katrina, côte du golfe des États-Unis."
inc1_p:
  other: "Dans bien des cas, les secours de services différents ne pouvaient pas se parler à cause d'attributions de fréquences incompatibles. Un hélicoptère militaire a dû larguer un message dans une bouteille pour les avertir d'une fuite de gaz."
inc1_src:
  other: "rapport du panel de la FCC"
inc2_h:
  other: "Crues de la vallée de l'Ahr et de l'Eifel, Allemagne."
inc2_p:
  other: "34 stations de base du réseau radio des secours ont été touchées. En mode dégradé, la radio ne fonctionnait plus qu'à l'intérieur de la cellule de chaque station, et les liaisons au-delà ont été rétablies au cas par cas, par exemple par des passerelles."
inc2_src:
  other: "Landtag Rheinland-Pfalz, Drucksache 18/1947"
inc3_h:
  other: "Incendie de Lahaina, Maui."
inc3_p:
  other: "Le réseau radio de sécurité publique du comté semble avoir fonctionné tout du long, mais la police n'entendait pas les canaux des pompiers ni les pompiers ceux de la police, et une couverture mobile peu fiable a privé de coordination les camions-citernes privés."
inc3_src:
  other: "rapport du FSRI pour le procureur général d'Hawaï"
inc4_h:
  other: "Panne d'électricité en Espagne et au Portugal."
inc4_p:
  other: "Les réseaux téléphoniques publics, fixes et mobiles, sont tombés, et le distributeur portugais s'est rabattu sur des téléphones satellites. Le gestionnaire du réseau espagnol pouvait encore appeler mais ne joignait pas le centre de conduite de la distribution à Séville, et le rétablissement en Andalousie a été suspendu."
inc4_src:
  other: "rapport du groupe d'experts de l'ENTSO-E"
