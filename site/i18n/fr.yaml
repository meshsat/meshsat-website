ig_study_eyebrow:
  other: "MSC-3T / ÉTUDE DU BOÎTIER"

ig_study_title:
  other: "Afficheur, commandes et prise en main"

ig_study_intro:
  other: "Un petit afficheur à papier électronique couleur compatible avec le Raspberry Pi est en cours d’évaluation. Ces vues explorent le boîtier et les commandes ; l’ergonomie et le placement des antennes nécessitent encore des essais."

ig_detail_alt:
  other: "Gros plan du concept MSC-3T avec afficheur à papier électronique, deux boutons en façade et joint du boîtier"

ig_detail_caption:
  other: "Étude de l’afficheur et des commandes. L’écran illustre des informations d’état."

ig_hand_alt:
  other: "Concept de boîtier MSC-3T tenu dans une main gantée, avec deux antennes visibles"

ig_hand_caption:
  other: "Étude de prise en main avec une main gantée. Taille et préhension non validées."

ig_field_alt:
  other: "Concept MSC-3T à côté d’une radio portable générique sur une mallette de transport dans une scène extérieure de synthèse"

ig_field_caption:
  other: "Illustration d’une équipe en mode direct. Scène simulée, pas un essai sur le terrain."

ig_exploded_caption:
  other: "Étude en vue éclatée : boîtier, afficheur, carte de calcul, modem Iridium, un module radio local et espace pour la batterie. Le placement des composants est illustratif."
