is_title:
  other: "Les réseaux se fragmentent en îlots"
is_sub:
  other: "Une catastrophe fait rarement taire tous les systèmes à la fois. Elle coupe les liens entre eux : la radio continue de fonctionner au sein d'un service ou d'une cellule, le réseau téléphonique tombe, et ce qu'une équipe sait n'atteint pas l'équipe qui en a besoin."
is_record_h:
  other: "C'est déjà arrivé"
is_joins_h:
  other: "Les relier, concrètement"
is_to:
  other: "vers"
join1_h:
  other: "Deux équipes sur deux réseaux maillés, sans internet"
join1_s:
  other: "Testé entre deux kits le 12 septembre 2026 par APRS, puis par SMS."
join2_h:
  other: "Une vallée sans réseau, un bureau au loin"
join2_s:
  other: "Le tronçon satellite a été vérifié sur une vraie liaison Iridium, en mars 2026."
join3_h:
  other: "Un réseau radio de bénévoles et un poste de commandement"
join3_s:
  other: "Les deux interfaces ont été testées sur le terrain. Cet itinéraire n'a pas encore été parcouru de bout en bout."
is_who:
  other: "Conçu pour les personnes qui travaillent entre ces îlots : équipes de recherche et de sauvetage, sécurité civile et gestion des crises, organisations humanitaires, réseaux d'urgence de radioamateurs, expéditions, équipages en mer et sites industriels isolés. Aucun de ces acteurs ne l'utilise encore ; le programme de terrain qui commence en novembre 2026 en est le premier vrai test."
inc1_h:
  other: "Ouragan Katrina, côte du golfe du Mexique (États-Unis)."
inc1_p:
  other: "Dans bien des cas, les secours de services différents ne pouvaient pas se parler à cause d'attributions de fréquences incompatibles. Un hélicoptère militaire a dû larguer un message dans une bouteille pour les avertir d'une fuite de gaz."
inc1_src:
  other: "rapport du groupe d'experts de la FCC"
inc2_h:
  other: "Inondations dans la vallée de l'Ahr et dans l'Eifel, Allemagne."
inc2_p:
  other: "Trente-quatre stations de base du réseau radio des secours ont été touchées. En mode dégradé, la radio ne fonctionnait plus qu'à l'intérieur de la cellule de chaque station, et les liaisons au-delà ont été rétablies au cas par cas, par exemple par des passerelles."
inc2_src:
  other: "Landtag Rheinland-Pfalz, Drucksache 18/1947"
inc3_h:
  other: "Incendie de Lahaina, Maui."
inc3_p:
  other: "Le réseau radio de sécurité publique du comté semble avoir fonctionné tout du long, mais la police n'entendait pas les canaux des pompiers ni les pompiers ceux de la police, et une couverture mobile peu fiable a privé de coordination les camions-citernes privés."
inc3_src:
  other: "rapport du FSRI pour le procureur général d'Hawaï"
inc4_h:
  other: "Panne d'électricité en Espagne et au Portugal."
inc4_p:
  other: "Les réseaux téléphoniques publics, fixes et mobiles, sont tombés, et le distributeur portugais s'est rabattu sur des téléphones satellites. Le gestionnaire du réseau espagnol pouvait encore appeler mais ne joignait pas le centre de conduite de la distribution à Séville, et le rétablissement en Andalousie a été suspendu."
inc4_src:
  other: "rapport du groupe d'experts de l'ENTSO-E"
shot_open:
  other: "Ouvrir en grand format"
shot_prev:
  other: "Capture précédente"
shot_next:
  other: "Capture suivante"
fab_bus:
  other: "règles, chaînes de transformation, ordre de basculement, coût"
fab_cap:
  other: "Les supports en haut, les intégrations en bas, un seul routeur entre eux : une règle peut router de n'importe quel adaptateur vers n'importe quel autre. En pointillés : pas encore de code dans le Bridge ; l'étiquette indique où en est le matériel."
host_lead:
  other: "La salle de contrôle de tous les kits, téléphones et nœuds de poche que vous exploitez : une seule carte, tous les messages, les routes entre les réseaux, et qui est appelé quand quelqu'un appuie sur SOS. Les kits n'en ont jamais besoin pour faire passer un message. Le code est le même dans les deux cas ; ce qui change, c'est qui le fait tourner et combien d'appareils vous pouvez enregistrer."
