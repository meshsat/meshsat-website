ig_dmr818_fact_0_1:
  other: "134-174, 320-400 ou 400-470 MHz"

ig_dmr818_fact_1_1:
  other: "2 W ; la fiche spécifie 1 W pour CE/FCC"

ig_dmr818_fact_3_1:
  other: "UART à 57 600 bauds ; commandes binaires"

ig_sx1262_note:
  other: "Un module radio, une antenne et un hôte Meshtastic sont en cours d'évaluation. Les limites de la puce n'autorisent pas à émettre avec ces réglages."

ig_sx1262_sourceLabel:
  other: "Spécifications publiques Semtech SX126x"

ig_sx1262_fact_0_1:
  other: "150-960 MHz (capacité de la puce)"

ig_sx1262_fact_1_1:
  other: "Jusqu'à +22 dBm (capacité de la puce)"

ig_sx1262_fact_2_1:
  other: "LoRa et (G)FSK"

ig_picoaprs_note:
  other: "Modèle VHF. Radioamateur uniquement, opérateur titulaire d'une licence, aucun chiffrement. Sa propre batterie est distincte du concept de batterie MSC-3."

