  other: "Votre temps d'antenne reste le vôtre. Connectez vos propres comptes Cloudloop, Twilio et Rock7 ; nous ne revendons ni satellite ni SMS."
plans_keeps:
  other: "Un appareil déjà enregistré continue de fonctionner sur toutes les formules. Une formule plus petite empêche seulement d'en ajouter, et un SOS n'est jamais affecté."
and_p:
  other: "Un téléphone Android ordinaire devient la passerelle, sans Pi. Associé à un nœud MeshSat de poche, il atteint la radio mesh et le modem Iridium par une seule liaison Bluetooth, et sa propre carte SIM ajoute le SMS. Les messages satellite attendent dans une file le prochain passage, que le téléphone prédit sans internet."
