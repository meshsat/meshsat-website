hero_eyebrow:
  other: "Quand les réseaux tombent, ce qui survit devient des îles. MeshSat les relie."
hero_title_a:
  other: "Un message."
hero_title_b:
  other: "Toutes les sorties."
hero_sub:
  other: "Un maillage qui fait parler une vallée, un réseau radio de bénévoles, un modem satellite, la carte d'un poste de commandement : chacun peut encore fonctionner, et aucun n'atteint les autres. MeshSat est un logiciel libre qui prend un message sur l'un et le livre dans un autre par le porteur encore vivant, en ne dépensant des octets satellite que lorsqu'il ne reste plus rien de gratuit."
hero_status:
  other: "Hub ouvert. Aucune flotte en service, jamais utilisé lors d'une vraie urgence."
hero_star:
  other: "Ajouter une étoile sur GitHub"
hero_visitors:
  other: "Visiteurs"
hero_donate:
  other: "Soutenir MeshSat"
trace_title:
  other: "Journal de routage, un message de détresse"
trace_bridge:
  other: "bridge tesseract"
trace_alt:
  other: "Exemple de journal de routage : un SOS arrive par maillage LoRa, la tentative Iridium échoue car le satellite est sous l'horizon, et le message est livré par SMS, TAK et MQTT à la place."
t1:
  other: "SOS du nœud !a4f2c1, 17 octets"
t2:
  other: "3 règles correspondantes, 4 routes retenues"
t3:
  other: "sous l'horizon, prochain passage dans 11m 38s"
t4:
  other: "smaz2 17 vers 11 octets, SMS au groupe de contacts"
t5:
  other: "position en Cursor-on-Target, en parallèle"
t6:
  other: "journalisé pour le tableau de bord et les webhooks"
trace_foot:
  other: "La liaison satellite a échoué et le message est quand même arrivé, dans trois systèmes que le maillage n'atteint pas seul. Les routes, l'ordre de bascule et les chaînes de transformation se configurent par interface."
tr_title:
  other: "Chaque système se branche sur le même routeur"
tr_sub:
  other: "Chaque système est un adaptateur derrière une même interface, avec sa propre MTU, son modèle de coût et sa chaîne de transformation, et une règle peut router de n'importe quel adaptateur vers n'importe quel autre. Aujourd'hui, huit porteurs tournent sur neuf interfaces, car Iridium compte deux fois, sur le 9603N et le 9704. La radio HF et le DMR figurent sur la feuille de route et ne sont pas construits. Le statut indique ce que nous avons réellement fait tourner, pas ce que nous espérons."
