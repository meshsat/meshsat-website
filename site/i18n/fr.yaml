hero_eyebrow:
  other: "Routage libre entre des radios qui ne peuvent pas se joindre"
hero_title_a:
  other: "Un message."
hero_title_b:
  other: "Toutes les sorties."
hero_sub:
  other: "Un maillage permet à un village de se parler à lui-même mais n'offre aucune sortie de la vallée. Un modem satellite atteint le monde entier et coûte de l'argent à chaque message. MeshSat est la couche intermédiaire : elle prend un message sur le maillage et l'envoie par le porteur encore vivant, en ne dépensant des octets satellite que lorsqu'il ne reste plus rien de gratuit."
hero_status:
  other: "Prototype avant publication. Jamais déployé chez un utilisateur réel, jamais utilisé lors d'une urgence."
hero_star:
  other: "Ajouter une étoile sur GitHub"
hero_visitors:
  other: "Visiteurs"
hero_donate:
  other: "Soutenir sur Ko-fi"
trace_title:
  other: "Journal de routage, un message de détresse"
trace_bridge:
  other: "bridge tesseract"
trace_alt:
  other: "Exemple de journal de routage : un SOS arrive par maillage LoRa, la tentative Iridium échoue car le satellite est sous l'horizon, et le message est livré par SMS, TAK et MQTT à la place."
t1:
  other: "SOS du nœud !a4f2c1, 17 octets"
t2:
  other: "3 règles correspondantes, 4 routes retenues"
t3:
  other: "sous l'horizon, prochain passage dans 11m 38s"
t4:
  other: "smaz2 17 vers 11 octets, SMS au groupe de contacts"
t5:
  other: "position en Cursor-on-Target, en parallèle"
t6:
  other: "journalisé pour le tableau de bord et les webhooks"
trace_foot:
  other: "La liaison satellite a échoué et le message est quand même arrivé. C'est tout le produit. Les routes, l'ordre de bascule et les chaînes de transformation se configurent par interface."
tr_title:
  other: "Huit porteurs, neuf interfaces câblées"
tr_sub:
  other: "Iridium fonctionne sur deux modems, le 9603N pour SBD et le 9704 pour IMT. Chaque porteur est une interface à part entière, avec sa propre MTU, son modèle de coût et sa chaîne de transformation. TAK et les webhooks sont des intégrations, pas des porteurs. Le statut indique ce que nous avons réellement fait tourner, pas ce que nous espérons."
