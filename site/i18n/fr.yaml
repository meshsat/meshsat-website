ig_eyebrow:
  other: "SÉRIE MSC-3 / DOSSIER D'INTÉGRATION"

ig_lead:
  other: "Un concept de passerelle de poche pour les radios d'une équipe, avec Iridium pour les textes, les états et les positions."

ig_intro:
  other: "Une plateforme. Une ou deux radios locales. Iridium dans chaque variante."

