  other: "Le dépôt donne la liste complète"
tr_note_b:
  other: "de ce qui est prouvé et de ce qui ne l'est pas."
cost_title:
  other: "Prendre le chemin le moins cher qui fonctionne encore."
cost_sub:
  other: "Une ligne Iridium coûte quelques dizaines d'euros par mois plus des crédits par message, facturés par crédit de 50 octets. Donnez-en une à chaque personne d'une équipe et la facture suit les effectifs. Ce prix pèse sur chaque décision de routage."
c1_h:
  other: "Une liaison payante, partagée"
c1_p:
  other: "Les membres d'une équipe portent des radios mesh bon marché. Une seule passerelle dispose de la coûteuse ligne satellite. Tout le monde communique avec l'extérieur par son intermédiaire, si bien que le coût ne suit plus le nombre de personnes."
c2_h:
  other: "Les supports gratuits d'abord"
c2_p:
  other: "Chaque interface déclare un coût. Le routeur privilégie les interfaces gratuites (réseau maillé, packet radio, Bluetooth et Wi-Fi) et ne recourt au satellite ou au SMS que lorsqu'aucune n'est disponible."
c3_h:
  other: "Et le moins d'octets possible quand il le faut"
c3_p:
  other: "Tout ce qui part sur un support facturé à l'usage est d'abord compressé. SMAZ2 s'exécute en moins d'une milliseconde sur du texte court, ce qui compte quand la facturation se fait par crédit et non par octet."
c4_h:
  other: "Envoyé quand le ciel s'y prête"
c4_p:
  other: "La prévision des passages, calculée à partir des éléments orbitaux SGP4, retient le trafic jusqu'à la prochaine fenêtre de visibilité, au lieu de vider la batterie en réessayant vers un satellite sous l'horizon."
funding_a:
  other: "Le Bridge est un logiciel libre sous GPLv3, le Hub sous Apache 2.0. Le développement est soutenu par"
funding_b:
  other: ", et un programme de terrain de six mois commence en novembre 2026."
hw_title:
  other: "Ce sur quoi il tourne"
hw_sub:
  other: "Commencez avec un ordinateur Linux et une radio mesh USB. Ajoutez le satellite, les SMS ou des capteurs selon vos besoins, puis configurez une route pour chaque liaison."
th_part:
  other: "Élément"
th_role:
  other: "Rôle"
hw1:
  other: "Hôte. ARM64, ou tout Linux x86_64 avec Docker et un port série USB."
hw2:
  other: "Radio mesh Meshtastic à 868 ou 915 MHz."
hw3:
  other: "Satellite Iridium. SBD à 340 octets, ou IMT à 100 ko."
hw4:
  other: "Réseau mobile 4G et 2G, pour les SMS et les données."
hw5:
  other: "Coordinateur ZigBee."
hw6:
  other: "Onduleur et batterie"
hw6r:
  other: "Parce que les cas intéressants sont justement ceux où le courant secteur est coupé, lui aussi."
cap1:
  other: "Spectre par bande, liaisons et santé de chaque support, servis par l'appareil lui-même"
cap2:
  other: "Prévision des passages, pour que la file attende un satellite réellement visible"
cap3:
  other: "Six heures de la bande LoRa 868 MHz. Le détecteur de brouillage n'a vu que du bruit ambiant."
cap4:
  other: "Un capteur ZigBee de température et d'humidité, et ses dernières 24 heures"
hw_note:
  other: "Le tableau de bord est intégré au binaire et servi depuis l'appareil. Aucune dépendance au cloud, aucun compte."
hw_repo_a:
  other: "Le matériel a son propre dépôt, "
hw_repo_b:
  other: " : les guides de montage des deux kits V1 et le projet V2, non construit, pour une valise Peli 1450. La V2 est toujours en revue technique et ne peut pas encore être commandée."
nf_title:
  other: "Ce que ce n'est pas"
nf_sub:
  other: "Starlink, c'est la connectivité ; Meshtastic, un réseau maillé local ; Reticulum, un réseau qui passe par n'importe quel support ; TAK, une carte partagée de la situation. MeshSat ne remplace aucun d'entre eux : il fait passer les messages de l'un à l'autre."
nf1_h:
  other: "Ne remplace pas Starlink"
nf1_p:
  other: "MeshSat transporte du texte, des positions et de la télémétrie. Pour les appels vidéo ou le web, prenez Starlink. Ceci vise les cas qu'une parabole ne couvre pas : sur batterie, format de poche, sans secteur."
nf2_h:
  other: "Ni voix ni vidéo"
nf2_p:
  other: "Les liaisons satellite et les réseaux maillés ont une latence élevée et un faible débit. Il s'agit de messagerie en stockage et retransmission. Pensez SMS, pas appel téléphonique."
nf3_h:
  other: "Pas un serveur de réseau LoRaWAN"
nf3_p:
  other: "Côté réseau maillé, MeshSat parle Meshtastic, un protocole propre qui s'appuie sur LoRa. Pour LoRaWAN, faites tourner ChirpStack et raccordez-le en MQTT."
nf4_h:
  other: "Pas un service d'urgence"
nf4_p:
  other: "Un prototype de recherche, qui ne remplace ni le 112, ni le 911, ni aucun numéro d'urgence national. Rien ici n'est certifié et rien ici n'a servi lors d'une urgence réelle."
