  other: "Une plateforme, différentes radios locales"

ig_platform_intro:
  other: "Les lettres après MSC-3 désignent les radios locales intégrées au concept. Iridium est toujours inclus et n'a pas besoin de lettre."

ig_platform_caption:
  other: "Concept de plateforme MSC-3 et limites de validation"

