trace_foot:
  other: "La liaison satellite a échoué et le message est quand même arrivé, dans trois systèmes que le maillage n'atteint pas seul. Les routes, l'ordre de bascule et les chaînes de transformation se configurent par interface."
tr_title:
  other: "Chaque système se branche sur le même routeur"
tr_sub:
  other: "Chaque système est un adaptateur derrière une même interface, avec sa propre MTU, son modèle de coût et sa chaîne de transformation, et une règle peut router de n'importe quel adaptateur vers n'importe quel autre. Le code de chaque canal dit où il en est réellement, pas ce que nous espérons : seul LIVE tourne aujourd'hui sur notre matériel."
