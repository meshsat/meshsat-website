ig_picoaprs_fact_3_1:
  other: "AX.25 à 1 200 bauds ; USB KISS TNC"

ig_mm6108_note:
  other: "Un module Morse Micro et une carte porteuse restent en cours d'évaluation. La carte LILYGO T-HaLow ci-dessous utilise TX-AH ; c'est un candidat distinct."

