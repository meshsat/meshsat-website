ig_pluto_note:
  other: "Spécifications de l'Analog Devices ADALM-PLUTO. Le fonctionnement GSM avec Osmocom, le filtrage RF et le traitement sur la plateforme nécessitent une validation. Autorisation propre à chaque site."

