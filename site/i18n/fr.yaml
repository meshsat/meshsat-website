tx_cell:
  other: "SMS et données (A7670E)"
tx_aprs:
  other: "APRS (Direwolf inclus, KISS)"
tx_rns:
  other: "Reticulum TCP (trames HDLC)"
tr_note_a:
  other: "L'agrégation de plusieurs porteurs sur une liaison satellite payante n'est pas encore validée, et le détecteur de brouillage n'a vu que du bruit ambiant."
tr_note_link:
  other: "Le dépôt donne la liste complète"
tr_note_b:
  other: "de ce qui est prouvé et de ce qui ne l'est pas."
cost_title:
  other: "Les octets satellite coûtent cher. C'est toute la conception."
cost_sub:
  other: "Une ligne Iridium coûte quelques dizaines d'euros par mois plus des crédits par message, facturés par blocs de 340 octets. Donnez-en une à chaque personne d'une équipe et la facture suit les effectifs. Ce prix est précisément la raison d'être de la couche de routage."
c1_h:
  other: "Une liaison payante, partagée"
c1_p:
  other: "Une équipe porte des radios maillées bon marché. Une passerelle détient la ligne satellite coûteuse. Tout le monde atteint l'extérieur par elle, si bien que le coût cesse de suivre le nombre de personnes."
c2_h:
  other: "Les porteurs gratuits d'abord"
c2_p:
  other: "Chaque interface déclare un coût. Le routeur préfère les gratuits, maillage, packet radio, Bluetooth et WiFi, et ne recourt au satellite ou au SMS que lorsque plus rien de gratuit n'est disponible."
c3_h:
  other: "Et alors le moins d'octets possible"
c3_p:
  other: "Tout ce qui part sur un porteur facturé est d'abord compressé. SMAZ2 s'exécute en moins d'une milliseconde sur du texte court, ce qui compte quand la facturation se fait par bloc et non par octet."
c4_h:
  other: "Envoyé quand le ciel s'y prête"
c4_p:
  other: "La prédiction de passage à partir des éléments orbitaux SGP4 retient le trafic jusqu'à une fenêtre de visibilité, au lieu d'épuiser la batterie contre un satellite sous l'horizon."
funding_a:
  other: "MeshSat est un logiciel libre sous GPLv3. Le développement est soutenu par"
funding_b:
  other: ", et un programme de terrain de six mois commence en novembre 2026."
hw_title:
  other: "Ce sur quoi il tourne"
hw_sub:
  other: "Un Raspberry Pi dans une valise étanche, avec des radios sur USB et GPIO. Les appareils sont identifiés au démarrage par leur identifiant USB et une sonde de protocole : les brancher constitue toute la configuration."
th_part:
  other: "Élément"
th_role:
  other: "Rôle"
hw1:
  other: "Hôte. ARM64, ou tout Linux x86_64 avec Docker et série USB."
hw2:
  other: "Radio maillée Meshtastic à 868 ou 915 MHz."
hw3:
  other: "Satellite Iridium. SBD à 340 octets, ou IMT à 100 Ko."
hw4:
  other: "Cellulaire 4G et 2G, pour SMS et données."
hw5:
  other: "Coordinateur ZigBee."
hw6:
  other: "Onduleur et batterie"
hw6r:
  other: "Parce que les cas intéressants sont justement ceux où le secteur a lâché aussi."
cap1:
  other: "Signal, trafic et santé des canaux, servis par l'appareil lui-même"
cap2:
  other: "Prédiction de passage, pour que la file attende un satellite réellement visible"
cap3:
  other: "Topologie du maillage en direct"
cap4:
  other: "Règles de transfert et état par passerelle"
hw_note:
  other: "Le tableau de bord est intégré au binaire et servi depuis l'appareil. Aucun nuage, aucun compte."
hw_repo_a:
  other: "Le matériel a son propre dépôt, "
hw_repo_b:
  other: " : les deux kits construits à ce jour avec leur guide de montage, et les cartes porteuses V2 pour une valise Peli 1520, conçues et prêtes pour la fabrication mais pas encore construites."
nf_title:
  other: "Ce que ce n'est pas"
nf_sub:
  other: "Le moyen le plus rapide de perdre un après-midi est d'en attendre la mauvaise chose."
nf1_h:
  other: "Pas un remplacement de Starlink"
nf1_p:
  other: "MeshSat transporte du texte, des positions et de la télémétrie. Pour les appels vidéo ou le web, prenez Starlink. Ceci vise les cas qu'une parabole ne couvre pas : sur batterie, format de poche, sans secteur."
nf2_h:
  other: "Ni voix ni vidéo"
nf2_p:
  other: "Les liaisons satellite et maillées ont une latence élevée et un faible débit. Il s'agit de messagerie en stockage et retransmission. Pensez SMS, pas appel téléphonique."
nf3_h:
  other: "Pas un serveur de réseau LoRaWAN"
nf3_p:
  other: "Le côté maillage parle Meshtastic, son propre protocole sur LoRa. Pour LoRaWAN, faites tourner ChirpStack et raccordez-le en MQTT."
nf4_h:
  other: "Pas un service d'urgence"
nf4_p:
  other: "Un prototype de recherche, pas un remplacement du 112, du 911 ni d'aucun numéro d'urgence national. Rien ici n'est certifié et rien ici n'a servi lors d'une urgence réelle."
sys_title:
  other: "Le reste du système"
sys_sub:
  other: "La Bridge est un seul appareil et fonctionne de façon entièrement autonome. Deux autres pièces existent pour quand un appareil ne suffit pas à décrire la situation."
hub_badge:
  other: "Bêta privée"
hub_status:
  other: "MeshSat Hub n'est pas encore lancé. Il tourne en bêta privée sur notre propre infrastructure. L'accès pour les démonstrations et les tests se met en place sur demande."
hub_p:
  other: "Gestion de flotte sur de nombreuses bridges : comptes OAuth2 et OIDC, clés d'API avec rôles, cloisonnement des locataires, chaînes d'escalade SOS, limites de débit par appareil et journal d'audit Ed25519 en chaîne de hachage. Déployable seul, en grappe ou sur Kubernetes."
hub_cta:
  other: "Demander un accès bêta"
and_p:
  other: "Un téléphone en passerelle autonome, sans Pi ni câbles. Il parle à une radio Meshtastic en Bluetooth LE, à un modem Iridium en Bluetooth SPP, et utilise le SMS du téléphone, le tout en même temps. Même chiffrement et mêmes formats de message que la Bridge."
and_cta:
  other: "Code source Android"
cta_title:
  other: "Essayer"
cta_sub:
  other: "Une commande sur une machine Linux avec une radio branchée. Un seul appareil suffit pour commencer, et ce qui manque est journalisé comme un avertissement, pas comme une erreur."
cta_source:
  other: "Lire le code source"
cta_docs:
  other: "Documentation"
cta_matrix:
  other: "Demander sur Matrix"
cta_note:
  other: "Les rapports de bogue venant de personnes qui utilisent du matériel que nous n'avons pas essayé sont ce que vous pouvez envoyer de plus utile. La liste du matériel pris en charge est courte parce qu'elle ne cite que ce que nous avons fait tourner physiquement."
