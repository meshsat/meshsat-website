ig_scope:
  other: "Périmètre de R&D, pas une spécification d'appareil validée. Aucune variante MSC-3 n'a jamais été déployée auprès d'un utilisateur réel. Ce n'est ni un service d'urgence, ni un substitut au 112."

ig_arch_alt:
  other: "Architecture conceptuelle. Les radios de l'équipe se connectent par un ou deux modules radio locaux à MeshSat Bridge sur un Raspberry Pi Zero 2 W. Le Bridge assure le routage entre les radios locales et un modem RockBLOCK 9704 utilisant Iridium IMT. Les messages satellite atteignent le système de l'intégrateur. Une batterie alimente la passerelle. Tous les chemins nécessitent une validation."

